name: Build NshmiAdmin APK

on:
  push:
    branches: [ main ]
    paths:
      - 'admin.html'
      - '.github/workflows/build-admin-apk.yml'
  workflow_dispatch:

jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Pillow for Icons
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Prepare Admin App and Icon
        run: |
          mkdir -p www assets
          cp -f admin.html www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets
          python3 - << 'PYEOF'
          from PIL import Image, ImageDraw
          fg = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          d = ImageDraw.Draw(fg)
          d.polygon([(512, 210), (770, 315), (735, 610), (512, 815), (289, 610), (254, 315)], fill=(17, 24, 39, 255), outline='white', width=28)
          d.polygon([(512, 315), (620, 512), (512, 705), (404, 512)], fill=(0, 122, 61, 255))
          fg.save('assets/icon-foreground.png')
          bg = Image.new('RGBA', (1024, 1024), (206, 17, 38, 255))
          bg.save('assets/icon-background.png')
          full = Image.alpha_composite(bg, fg)
          full.save('assets/icon-only.png')
          PYEOF
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nshmibike.admin",
            "appName": "NshmiAdmin",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build Admin APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: NshmiAdmin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
