<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#007A3D" />
  <link rel="manifest" href="manifest.json" />
  <title>NshmiBike 🇯🇴</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background: #0f172a; }
    #map { height: 100%; width: 100%; z-index: 1; }
    .jo-green { background-color: #007A3D; }
    .jo-text { color: #007A3D; }
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 36px) !important; }
    .shmagh-strip { height: 6px; background: repeating-linear-gradient(45deg, #CE1126, #CE1126 8px, #fff 8px, #fff 16px); }
    .gps-dot { width: 16px; height: 16px; background: #2563eb; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 8px rgba(37,99,235,0.25); }
  </style>
</head>
<body class="min-h-screen flex justify-center bg-slate-900">

  <div id="toast-banner" class="hidden fixed top-3 left-1/2 -translate-x-1/2 z-[60] w-[92%] max-w-[400px] bg-slate-900 text-white p-3.5 rounded-2xl shadow-2xl border-r-4 border-[#CE1126]">
    <div id="toast-title" class="font-extrabold text-xs text-emerald-400"></div>
    <div id="toast-body" class="text-xs mt-0.5"></div>
  </div>

  <div class="w-full max-w-[440px] h-screen bg-white flex flex-col relative shadow-2xl overflow-hidden">

    <!-- 1. دخول وتسجيل العميل المنفصل -->
    <div id="screen-login" class="flex-1 flex flex-col justify-center p-5 bg-gradient-to-b from-emerald-50 via-white to-red-50/40 relative overflow-y-auto safe-bottom">
      <div class="shmagh-strip absolute top-0 left-0 right-0"></div>
      <div class="flex justify-end mb-2">
        <button onclick="toggleLanguage()" class="bg-white border border-slate-200 px-3 py-1 rounded-full text-xs font-extrabold text-slate-700 shadow-sm">🌐 <span class="lang-switch-label">English</span></button>
      </div>
      <div class="text-center mb-4">
        <div class="w-16 h-16 jo-green rounded-3xl mx-auto flex items-center justify-center text-3xl shadow-lg mb-2 border-2 border-[#CE1126]">🛵</div>
        <h1 class="text-2xl font-extrabold text-slate-900">Nshmi<span class="text-[#CE1126]">Bike</span> 🇯🇴</h1>
        <p data-i18n="tagline" class="text-[11px] text-slate-600 font-semibold mt-0.5">واجهة العملاء • عمّان • إربد • الزرقاء</p>
      </div>

      <div class="bg-white p-4 rounded-3xl shadow-lg border border-slate-100 space-y-3">
        <div class="grid grid-cols-2 gap-1.5 bg-slate-100 p-1 rounded-2xl text-xs font-extrabold">
          <button type="button" id="auth-tab-login" onclick="switchAuthMode('login')" class="jo-green text-white py-2 rounded-xl">تسجيل الدخول</button>
          <button type="button" id="auth-tab-reg" onclick="switchAuthMode('register')" class="text-slate-600 py-2 rounded-xl">عميل جديد</button>
        </div>
        <div id="reg-fields" class="hidden space-y-2.5">
          <div><label class="block text-[11px] font-bold text-slate-700 mb-1">الاسم الكامل</label><input id="login-name" type="text" placeholder="مثال: يزيد" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm"></div>
          <div><label class="block text-[11px] font-bold text-slate-700 mb-1">رقم الهاتف الأردني (خاص بك وحدك)</label><input id="login-phone" type="tel" placeholder="079xxxxxxx" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm text-left" dir="ltr"></div>
        </div>
        <div><label data-i18n="emailLabel" class="block text-[11px] font-bold text-slate-700 mb-1">البريد الإلكتروني</label><input id="login-email" type="email" placeholder="customer@gmail.com" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm text-left" dir="ltr"></div>
        <div><label data-i18n="passLabel" class="block text-[11px] font-bold text-slate-700 mb-1">كلمة المرور (6 أحرف فأكثر)</label><input id="login-pass" type="password" placeholder="******" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm text-left" dir="ltr"></div>
        <div class="flex items-center justify-between text-xs pt-1">
          <label class="flex items-center gap-1.5 font-bold text-slate-700 cursor-pointer"><input id="remember-me" type="checkbox" checked class="accent-[#007A3D] w-4 h-4"><span data-i18n="rememberMe">تذكرني عند الدخول</span></label>
          <button type="button" onclick="resetPassword()" class="text-[#CE1126] font-bold underline text-[11px]">نسيت كلمة المرور؟</button>
        </div>
        <button onclick="loginRider()" id="btn-login" class="w-full jo-green text-white font-extrabold py-3 rounded-2xl shadow-lg text-sm">دخول العميل 🔔</button>
        <p id="login-error" class="text-xs text-red-600 font-bold text-center hidden"></p>
      </div>
    </div>

    <!-- 2. شاشة العميل -->
    <div id="screen-rider" class="hidden flex-1 flex flex-col h-full relative">
      <div class="shmagh-strip shrink-0"></div>
      <header class="p-3 bg-white shadow-sm flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center gap-2">
          <button onclick="toggleDrawer(true)" class="w-9 h-9 bg-slate-100 rounded-xl flex items-center justify-center text-lg font-bold text-slate-800">☰</button>
          <div>
            <div class="font-extrabold text-slate-900 text-sm leading-tight">Nshmi<span class="text-[#CE1126]">Bike</span> 🇯🇴</div>
            <div id="city-badge" class="text-[10px] jo-text font-extrabold">📍 جاري تحديد مدينتك...</div>
          </div>
        </div>
        <div class="flex gap-1.5">
          <button onclick="toggleLanguage()" class="bg-slate-100 text-slate-700 text-[11px] font-extrabold px-2.5 py-1 rounded-full lang-switch-label">EN</button>
          <button onclick="testAudio()" class="bg-emerald-50 text-[#007A3D] text-[11px] font-bold px-2 py-1 rounded-full">🔔</button>
          <button onclick="triggerSOS()" class="bg-[#CE1126] text-white text-[11px] font-bold px-2.5 py-1 rounded-full">🆘 SOS</button>
        </div>
      </header>

      <div class="relative flex-1 bg-slate-100">
        <div id="map"></div>
        <div class="absolute top-3 left-3 right-3 z-10 flex justify-between items-center pointer-events-none">
          <select id="city-filter" onchange="switchCity(this.value)" class="pointer-events-auto bg-white/95 backdrop-blur px-3 py-1.5 rounded-full shadow-md text-xs font-extrabold text-slate-800 border border-slate-100">
            <option value="amman">🏙️ عمّان</option><option value="irbid">🏙️ إربد</option><option value="zarqa">🏙️ الزرقاء</option>
          </select>
          <button onclick="useMyGPS()" class="pointer-events-auto bg-white/95 backdrop-blur px-3 py-1.5 rounded-full shadow-md text-xs font-extrabold text-blue-600 border border-slate-100">🎯 موقعي GPS</button>
        </div>
      </div>

      <div id="rider-panel-dest" class="bg-white rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.12)] px-4 pt-3 safe-bottom z-20 shrink-0 space-y-2.5">
        <div id="debt-notice" class="hidden bg-red-50 text-[#CE1126] text-[10px] font-extrabold text-center py-1 rounded-lg"></div>
        <div class="flex items-center gap-2 text-xs font-bold text-slate-600 bg-blue-50/70 px-3 py-2 rounded-xl">
          <span class="w-2.5 h-2.5 rounded-full bg-blue-600 inline-block shrink-0"></span>
          <span id="pickup-label" class="truncate">انطلاقك: جاري تحديد موقعك عبر GPS...</span>
        </div>
        <div class="flex gap-1.5">
          <input id="dest-search" type="text" placeholder="🔍 إلى أين تريد الذهاب؟ (نطاق 35 كم)" class="flex-1 bg-slate-100 rounded-2xl px-3.5 py-2.5 text-xs font-bold">
          <button onclick="searchPlace()" class="jo-green text-white px-4 rounded-2xl text-xs font-extrabold">بحث</button>
        </div>
        <div id="search-results" class="hidden max-h-32 overflow-y-auto space-y-1 bg-slate-50 p-2 rounded-2xl border border-slate-100"></div>
        <div>
          <div id="quick-city-title" class="text-[11px] font-extrabold text-slate-500 mb-1.5">خيارات سريعة في مدينتك:</div>
          <div id="quick-places" class="flex gap-1.5 overflow-x-auto pb-1"></div>
        </div>
      </div>

      <div id="rider-panel-book" class="hidden bg-white rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.14)] px-4 pt-3 safe-bottom z-20 shrink-0">
        <div class="flex items-center justify-between mb-2">
          <div class="text-xs font-extrabold text-slate-800 truncate flex-1">📍 إلى: <span id="chosen-dest-label" class="jo-text"></span></div>
          <button onclick="backToDestStep()" class="text-[11px] bg-slate-100 px-2.5 py-1 rounded-full font-bold text-slate-600">✏️ تغيير</button>
        </div>
        <div class="grid grid-cols-3 gap-1.5 mb-2">
          <button onclick="selectTier('SCOOTER')" id="tier-SCOOTER" class="tier-btn border-2 border-[#007A3D] bg-emerald-50 rounded-xl p-1.5 text-center"><div class="text-base">🛵</div><div data-i18n="tierScooter" class="text-[10px] font-extrabold">نشمي سكوتر</div><div id="price-SCOOTER" class="text-xs font-extrabold jo-text">0.60 د.أ</div></button>
          <button onclick="selectTier('BIKE')" id="tier-BIKE" class="tier-btn border border-slate-200 bg-white rounded-xl p-1.5 text-center"><div class="text-base">🏍️</div><div data-i18n="tierBike" class="text-[10px] font-extrabold">نشمي بايك</div><div id="price-BIKE" class="text-xs font-extrabold text-slate-700">0.75 د.أ</div></button>
          <button onclick="selectTier('EXPRESS')" id="tier-EXPRESS" class="tier-btn border border-slate-200 bg-white rounded-xl p-1.5 text-center"><div class="text-base">📦</div><div data-i18n="tierExpress" class="text-[10px] font-extrabold">طرود سريعة</div><div id="price-EXPRESS" class="text-xs font-extrabold text-slate-700">0.70 د.أ</div></button>
        </div>
        <div id="car-savings-badge" class="bg-emerald-50 text-[#007A3D] text-[10px] font-bold text-center py-1 rounded-lg mb-1.5"></div>
        <div id="book-debt-line" class="hidden bg-red-50 text-[#CE1126] text-[10px] font-extrabold text-center py-1 rounded-lg mb-1.5"></div>
        <div class="flex gap-1.5 mb-1.5">
          <input id="promo-input" type="text" placeholder="كود الخصم / Promo" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1 text-xs uppercase font-bold">
          <button onclick="applyPromo()" data-i18n="applyBtn" class="bg-slate-900 text-white px-3 rounded-xl text-xs font-bold">تطبيق</button>
        </div>
        <div class="flex items-center justify-between text-[11px] mb-2">
          <label class="flex items-center gap-1 font-bold text-slate-700"><input id="extra-helmet" type="checkbox" checked class="accent-[#007A3D] w-3.5 h-3.5"><span data-i18n="helmetReq">🪖 خوذة معقمة</span></label>
          <select id="payment-method" class="bg-slate-100 px-2 py-1 rounded-lg font-bold text-slate-700">
            <option value="كاش">💵 كاش / Cash</option><option value="محفظة نشمي">👛 المحفظة / Wallet</option>
          </select>
        </div>
        <button onclick="requestRide()" id="btn-request-ride" data-i18n="orderBtn" class="w-full jo-green text-white font-extrabold py-3 rounded-2xl shadow-lg text-sm">اطلب NshmiBike الآن 🇯🇴</button>
      </div>

      <div id="rider-panel-active" class="hidden bg-white rounded-t-3xl shadow-2xl px-4 pt-4 safe-bottom z-20 space-y-2.5 shrink-0">
        <div class="flex justify-between items-center">
          <span id="rider-ride-status" class="bg-amber-100 text-amber-800 text-xs font-extrabold px-3 py-1 rounded-full">جاري توجيه الطلب...</span>
          <span id="rider-ride-fare" class="font-extrabold text-slate-800 text-xs"></span>
        </div>
        <div id="rider-arrival-timer" class="hidden bg-blue-50 text-blue-800 text-[11px] font-bold text-center py-1 rounded-xl"></div>
        <div id="rider-wait-timer" class="hidden bg-red-50 text-[#CE1126] text-xs font-extrabold text-center py-1.5 rounded-xl"></div>
        <div id="rider-cancel-warning" class="hidden bg-amber-50 text-amber-900 text-[11px] font-bold text-center py-1 rounded-lg"></div>
        <div id="captain-info-box" class="hidden bg-slate-50 p-2.5 rounded-2xl border border-slate-100 flex justify-between items-center">
          <div><div id="cap-info-name" class="font-extrabold text-sm text-slate-800"></div><div id="cap-info-bike" class="text-xs text-slate-500"></div></div>
          <div class="flex gap-1.5"><button onclick="shareRide()" class="bg-white border px-2.5 py-1.5 rounded-xl text-xs font-bold">🔗</button><a id="cap-call-link" href="#" class="jo-green text-white px-2.5 py-1.5 rounded-xl text-xs font-bold">📞</a></div>
        </div>
        <div id="rider-chat-box" class="hidden border border-slate-100 rounded-2xl p-2 bg-slate-50">
          <div id="rider-messages" class="max-h-24 overflow-y-auto text-xs space-y-1 mb-2"></div>
          <div class="flex gap-1"><input id="rider-chat-input" type="text" placeholder="راسل الكابتن..." class="flex-1 bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs"><button onclick="sendChat()" class="jo-green text-white px-3 rounded-xl text-xs font-bold">إرسال</button></div>
        </div>
        <button onclick="cancelRideRider()" id="btn-rider-cancel" data-i18n="cancelBtn" class="w-full bg-slate-100 text-slate-700 font-bold py-2.5 rounded-xl text-xs">إلغاء الطلب</button>
      </div>

      <div id="rider-panel-rating" class="hidden bg-white rounded-t-3xl shadow-2xl px-5 pt-5 safe-bottom z-30 text-center space-y-3 shrink-0">
        <div class="text-3xl">🎉</div>
        <h3 data-i18n="arrivedSafe" class="font-extrabold text-slate-800 text-base">الحمد لله على السلامة! قيّم تجربتك</h3>
        <p id="rating-summary" class="text-xs text-slate-500 font-semibold"></p>
        <div class="flex justify-center gap-3 text-3xl py-1">
          <button onclick="selectStars(1)" id="star-1" class="opacity-40">⭐</button><button onclick="selectStars(2)" id="star-2" class="opacity-40">⭐</button>
          <button onclick="selectStars(3)" id="star-3" class="opacity-40">⭐</button><button onclick="selectStars(4)" id="star-4" class="opacity-40">⭐</button>
          <button onclick="selectStars(5)" id="star-5" class="scale-110">⭐</button>
        </div>
        <input id="rating-comment" type="text" placeholder="ملاحظة اختيارية عن الكابتن..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
        <div class="flex gap-2">
          <button onclick="skipRating()" class="w-24 bg-slate-100 text-slate-600 font-bold py-3 rounded-2xl text-xs">تخطي</button>
          <button onclick="submitRating()" class="flex-1 jo-green text-white font-extrabold py-3 rounded-2xl text-sm shadow">إرسال التقييم ✓</button>
        </div>
      </div>

      <div id="drawer-backdrop" onclick="toggleDrawer(false)" class="hidden fixed inset-0 bg-black/50 z-40"></div>
      <aside id="side-drawer" class="hidden fixed top-0 bottom-0 w-[80%] max-w-[310px] bg-white z-50 flex flex-col shadow-2xl overflow-y-auto safe-bottom">
        <div class="shmagh-strip shrink-0"></div>
        <div class="bg-gradient-to-br from-[#007A3D] to-slate-900 text-white p-5 flex items-center gap-3">
          <div id="drawer-avatar" class="w-14 h-14 rounded-full bg-white/20 border-2 border-white flex items-center justify-center text-2xl font-extrabold">ن</div>
          <div class="overflow-hidden"><div id="drawer-name" class="font-extrabold text-base truncate"></div><div id="drawer-phone" class="text-xs text-emerald-200 font-semibold" dir="ltr"></div><div id="drawer-email" class="text-[10px] text-white/75 truncate" dir="ltr"></div></div>
        </div>
        <nav class="flex-1 py-2 divide-y divide-slate-100 text-sm font-bold text-slate-700">
          <button onclick="openModal('profile')" class="w-full px-5 py-3 flex items-center gap-3"><span>👤</span><span data-i18n="mProfile">الملف الشخصي</span></button>
          <button onclick="openModal('trips')" class="w-full px-5 py-3 flex items-center gap-3"><span>🕒</span><span data-i18n="mTrips">رحلاتي</span></button>
          <button onclick="openModal('wallet')" class="w-full px-5 py-3 flex items-center justify-between"><span class="flex items-center gap-3"><span>💳</span><span data-i18n="mWallet">المحفظة</span></span><span id="drawer-wallet-val" class="text-xs font-extrabold jo-text">0.00 د.أ</span></button>
          <button onclick="openModal('inbox')" class="w-full px-5 py-3 flex items-center gap-3"><span>📬</span><span data-i18n="mInbox">صندوق الرسائل والعروض</span></button>
          <button onclick="openModal('invite')" class="w-full px-5 py-3 flex items-center gap-3"><span>👥</span><span data-i18n="mInvite">دعوة الأصدقاء</span></button>
          <button onclick="openModal('referral')" class="w-full px-5 py-3 flex items-center gap-3"><span>🏷️</span><span data-i18n="mReferral">كود الإحالة والمكافآت</span></button>
          <button onclick="openModal('contact')" class="w-full px-5 py-3 flex items-center gap-3"><span>🎧</span><span data-i18n="mContact">تواصل معنا</span></button>
          <button onclick="openModal('settings')" class="w-full px-5 py-3 flex items-center gap-3"><span>⚙️</span><span data-i18n="mSettings">الإعدادات واللغة</span></button>
          <button onclick="openModal('terms')" class="w-full px-5 py-3 flex items-center gap-3"><span>❓</span><span data-i18n="mTerms">الشروط والأحكام</span></button>
          <button onclick="openModal('diag')" class="w-full px-5 py-3 flex items-center gap-3"><span>🛠️</span><span data-i18n="mDiag">فحص الاتصال</span></button>
        </nav>
        <div class="p-4 border-t border-slate-100">
          <button onclick="logout()" class="w-full text-right text-[#CE1126] font-extrabold text-sm py-1" data-i18n="logout">تسجيل الخروج</button>
          <div class="text-[11px] text-slate-400 mt-1">NshmiBike Jordan • v3.1.0 🇯🇴</div>
        </div>
      </aside>

      <div id="app-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center">
        <div class="w-full max-w-[440px] bg-white rounded-t-3xl sm:rounded-3xl px-5 pt-5 safe-bottom max-h-[85vh] overflow-y-auto space-y-4">
          <div class="flex justify-between items-center border-b pb-2.5"><h3 id="modal-title" class="font-extrabold text-base text-slate-800"></h3><button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 font-bold">✕</button></div>
          <div id="modal-body" class="text-xs text-slate-700 space-y-3"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, getDoc, getDocs, setDoc, updateDoc, runTransaction, onSnapshot, query, where, serverTimestamp, orderBy, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXa39YZfFdLQ48CYgjHNSHI1mlIRuA1UU", authDomain: "nshmibike.firebaseapp.com",
      databaseURL: "https://nshmibike-default-rtdb.europe-west1.firebasedatabase.app", projectId: "nshmibike",
      storageBucket: "nshmibike.firebasestorage.app", messagingSenderId: "506031565051", appId: "1:506031565051:web:fc915e5a2173e841c7a85e"
    };
    const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
    const MAX_RIDE_KM = 35, SESSION_KEY = 'nshmi_rider_v2';
    const CITIES = {

        if (!activeRideId) map.setView(pickupCoords, 15);

      }, () => {
        renderCityPlaces('amman'); pickupCoords = CITIES.amman.center;
        if (pickupMarker) map.removeLayer(pickupMarker);
        pickupMarker = L.marker(pickupCoords, { icon: gpsIcon }).addTo(map);
        document.getElementById('pickup-label').innerText = 'انطلاقك: وسط عمّان (فعّل GPS)';

    window.searchPlace = async () => {
      const q = document.getElementById('dest-search').value.trim(), box = document.getElementById('search-results');
      if (!q) return; box.classList.remove('hidden'); box.innerHTML = '<div class="text-xs text-slate-500 p-2">جاري البحث...</div>';
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=jo&accept-language=ar&limit=5&q=${encodeURIComponent(q + ' ' + CITIES[currentCity].nameAr)}`);
        const data = await res.json();
        if (!data.length) { box.innerHTML = '<div class="text-xs text-red-500 p-2">لم نجد نتائج، اضغط على الخريطة</div>'; return; }
        box.innerHTML = '';
        data.forEach((item) => {
          const btn = document.createElement('button'); btn.className = 'w-full text-right bg-white p-2 rounded-xl border border-slate-100 text-xs font-bold';
          btn.innerText = '📍 ' + item.display_name.split(',').slice(0, 3).join('، ');
          btn.onclick = () => { box.classList.add('hidden'); pickDestination([Number(item.lat), Number(item.lon)], item.display_name.split(',')[0]); };
          box.appendChild(btn);
        });
      } catch (e) { box.innerHTML = '<div class="text-xs text-red-500 p-2">اضغط على الخريطة مباشرة</div>'; }
    };

    window.pickDestination = (coords, label) => {
      const roadKm = haversine(pickupCoords, coords) * 1.28;
      if (roadKm > MAX_RIDE_KM) return alert(`⚠️ هذه الوجهة بعيدة (${roadKm.toFixed(1)} كم). الحد الأقصى ${MAX_RIDE_KM} كم.`);
      dropoffCoords = coords; dropoffAddress = label;
      document.getElementById('chosen-dest-label').innerText = label;
      document.getElementById('rider-panel-dest').classList.add('hidden');
      document.getElementById('rider-panel-book').classList.remove('hidden');
      updateRoute();
    };
    window.backToDestStep = () => {
      document.getElementById('rider-panel-book').classList.add('hidden'); document.getElementById('rider-panel-dest').classList.remove('hidden');
      if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; }
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      dropoffCoords = null; if (pickupCoords) map.setView(pickupCoords, 15);
    };

    window.applyPromo = async () => {
      const code = document.getElementById('promo-input').value.trim().toUpperCase(); if (!code) return;
      const snap = await getDoc(doc(db, 'promos', code));
      if (!snap.exists() || !snap.data().active) { appliedPromo = null; updateRoute(); return alert('كود غير صحيح أو منتهي'); }
      const p = snap.data();
      if (Number(p.usedCount || 0) >= Number(p.maxTotalUses || 9999)) { appliedPromo = null; updateRoute(); return alert('⚠️ انتهى العدد الإجمالي للكود'); }
      const maxPerUser = Number(p.maxPerUser || 1), myUsed = Number((currentUser.promoUsage && currentUser.promoUsage[code]) || 0);
      if (myUsed >= maxPerUser) { appliedPromo = null; updateRoute(); return alert(`⚠️ استهلكت الحد المسموح (${maxPerUser} رحلات)`); }
      const maxJod = Number(p.maxDiscountJod ?? 0.75);
      appliedPromo = { code, discountPct: Number(p.discountPct || 0), maxDiscountJod: maxJod, companyPays: p.companyPays !== false };
      updateRoute(); alert(`🎉 تم تفعيل خصم ${appliedPromo.discountPct}% (سقف ${maxJod.toFixed(2)} د.أ)!`);
    };

    window.updateRoute = () => {
      if (!map || !dropoffCoords) return;
      if (dropoffMarker) map.removeLayer(dropoffMarker); if (routeLine) map.removeLayer(routeLine);
      dropoffMarker = L.circleMarker(dropoffCoords, { radius: 9, color: '#CE1126', fillColor: '#CE1126', fillOpacity: 1 }).addTo(map);
      routeLine = L.polyline([pickupCoords, dropoffCoords], { color: '#007A3D', weight: 4, dashArray: '8, 8' }).addTo(map);
      map.fitBounds([pickupCoords, dropoffCoords], { padding: [55, 55] });

      currentDistKm = Math.max(0.8, haversine(pickupCoords, dropoffCoords) * 1.28);
      origFares.SCOOTER = Math.max(pricing.scooterMin, +(pricing.scooterBase + currentDistKm * pricing.scooterPerKm).toFixed(2));
      origFares.BIKE = Math.max(pricing.bikeMin || 0.75, +(pricing.bikeBase + currentDistKm * pricing.bikePerKm).toFixed(2));
      origFares.EXPRESS = Math.max(0.70, +(pricing.scooterBase + currentDistKm * (pricing.scooterPerKm + 0.01)).toFixed(2));

      const calcDisc = (o) => !appliedPromo ? 0 : Math.min(appliedPromo.maxDiscountJod, +(o * (appliedPromo.discountPct / 100)).toFixed(2));
      fares.SCOOTER = Math.max(0.30, +(origFares.SCOOTER - calcDisc(origFares.SCOOTER)).toFixed(2));
      fares.BIKE = Math.max(0.40, +(origFares.BIKE - calcDisc(origFares.BIKE)).toFixed(2));
      fares.EXPRESS = Math.max(0.35, +(origFares.EXPRESS - calcDisc(origFares.EXPRESS)).toFixed(2));

      document.getElementById('price-SCOOTER').innerText = fares.SCOOTER.toFixed(2) + ' د.أ';
      document.getElementById('price-BIKE').innerText = fares.BIKE.toFixed(2) + ' د.أ';
      document.getElementById('price-EXPRESS').innerText = fares.EXPRESS.toFixed(2) + ' د.أ';

      const estCar = Math.max(1.50, +(0.47 + currentDistKm * 0.34 + 0.30).toFixed(2));
      const saved = Math.max(0.50, +(estCar - fares[selectedTier]).toFixed(2));
      const appliedDisc = +(origFares[selectedTier] - fares[selectedTier]).toFixed(2);
      document.getElementById('car-savings-badge').innerText = `المسافة ${currentDistKm.toFixed(1)} كم • توفر ~${saved.toFixed(2)} د.أ عن السيارة${appliedPromo ? ` (خصم ${appliedDisc.toFixed(2)} د.أ)` : ''}`;
    };

    window.selectTier = (t) => {
      selectedTier = t;
      document.querySelectorAll('.tier-btn').forEach(b => b.className = 'tier-btn border border-slate-200 bg-white rounded-xl p-1.5 text-center');
      document.getElementById('tier-' + t).className = 'tier-btn border-2 border-[#007A3D] bg-emerald-50 rounded-xl p-1.5 text-center';
      updateRoute();
    };

    function startArrivalCountdown(deadlineMs, hasPenalty) {
      if (arrivalInterval) clearInterval(arrivalInterval);
      const el = document.getElementById('rider-arrival-timer'); if (!deadlineMs) { el.classList.add('hidden'); return; }
      el.classList.remove('hidden');
      const tick = () => {
        const leftSec = Math.max(0, Math.floor((deadlineMs - Date.now()) / 1000));
        if (leftSec > 0 && !hasPenalty) {
          el.className = 'bg-blue-50 text-blue-800 text-[11px] font-bold text-center py-1 rounded-xl';
          el.innerText = `⏱️ وقت الوصول المتوقع (شامل الازدحام): ${String(Math.floor(leftSec/60)).padStart(2,'0')}:${String(leftSec%60).padStart(2,'0')}`;
        } else {
          el.className = 'bg-red-50 text-[#CE1126] text-[11px] font-extrabold text-center py-1 rounded-xl';
          el.innerText = '⚠️ الكابتن تأخر عن الموعد! تم تغريمه 0.60 د.أ ويمكنك الإلغاء مجاناً';
        }
      };
      tick(); arrivalInterval = setInterval(tick, 1000);
    }

    function startWaitCountdown(d) {
      if (waitInterval) clearInterval(waitInterval);
      const el = document.getElementById('rider-wait-timer'); el.classList.remove('hidden');
      const arrivedAtMs = Number(d.arrivedAtMs || Date.now()), totalPausedMs = Number(d.totalPausedMs || 0);
      const update = () => {
        if (d.waitPaused) {
          const left = Math.max(0, 300 - Math.floor((Number(d.pauseStartedMs || Date.now()) - arrivedAtMs - totalPausedMs) / 1000));
          el.innerText = `⏸️ توقف العداد (${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}) لأن الكابتن ابتعد عن موقعك!`;
          return;
        }
        const left = Math.max(0, 300 - Math.floor((Date.now() - arrivedAtMs - totalPausedMs) / 1000));
        el.innerText = left > 0 ? `⏱️ الكابتن بانتظارك: ${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')} (الإلغاء يخصم 0.50 د.أ)` : '⚠️ انتهى وقت الانتظار المجاني (5 دقائق)';
      };
      update(); waitInterval = setInterval(update, 1000);
    }

    async function buildFastDispatchQueue(cityAr) {
      try {
        // استعلام فائق السرعة على الكباتن المتصلين فقط في جدول captains
        const snap = await getDocs(query(collection(db, 'captains'), where('isOnline', '==', true)));
        const candidates = [];
        snap.forEach(d => {
          const u = d.data();
          if (!u.isBlocked && u.isApproved === true && Number(u.walletBalance || 0) > -2.0 && (!u.city || u.city === cityAr)) {
            const distKm = (u.lat && u.lng) ? haversine(pickupCoords, [u.lat, u.lng]) : 4.0;
            if (distKm <= 8.0) {
              const score = Math.max(0, (8.0 - distKm) / 8.0) * 60 + (Number(u.acceptRate ?? 100) / 100) * 20 + (Number(u.avgStars ?? 5.0) / 5.0) * 20;
              candidates.push({ id: d.id, score });
            }
          }
        });
        candidates.sort((a, b) => b.score - a.score);
        return candidates.slice(0, 5).map(c => c.id);
      } catch (e) { return []; }
    }

    function attachToRide(rideId, initialData) {
      activeRideId = rideId; activeRideData = initialData; lastRideStatus = null;
      keepAwake(true);
      const debt = Number(initialData.settledDebtJod || 0);
      document.getElementById('rider-panel-dest').classList.add('hidden');
      document.getElementById('rider-panel-book').classList.add('hidden');
      document.getElementById('rider-panel-active').classList.remove('hidden');
      document.getElementById('rider-ride-fare').innerText = debt > 0 ? `${Number(initialData.fareJod).toFixed(2)} د.أ (شامل ${debt.toFixed(2)} ذمة)` : `${Number(initialData.fareJod).toFixed(2)} د.أ`;

      unsubRide = onSnapshot(doc(db, 'rides', activeRideId), (snap) => {
        const data = snap.data(); if (!data) return;
        activeRideData = data;
        const badge = document.getElementById('rider-ride-status');
        if (data.captainLat && data.captainLng && map) {
          if (capMarker) capMarker.setLatLng([data.captainLat, data.captainLng]);
          else capMarker = L.marker([data.captainLat, data.captainLng], { icon: bikeIcon }).addTo(map);
        }

        const isLate = data.arrivalDeadlineMs && Date.now() > data.arrivalDeadlineMs;
        const capFault = !!(data.captainPenaltyApplied || data.waitPaused || isLate);
        const warnEl = document.getElementById('rider-cancel-warning');

        if (data.status === 'ACCEPTED') startArrivalCountdown(data.arrivalDeadlineMs, !!data.captainPenaltyApplied);
        else { if (arrivalInterval) clearInterval(arrivalInterval); document.getElementById('rider-arrival-timer').classList.add('hidden'); }
        if (data.status === 'ARRIVED') startWaitCountdown(data);
        else { if (waitInterval) clearInterval(waitInterval); document.getElementById('rider-wait-timer').classList.add('hidden'); }

        if (capFault && ['ACCEPTED', 'ARRIVED'].includes(data.status)) {
          warnEl.innerText = '✅ الإلغاء الآن مجاني لك (تأخر الكابتن أو غادر الموقع)'; warnEl.className = 'bg-emerald-50 text-[#007A3D] text-[11px] font-bold text-center py-1 rounded-lg'; warnEl.classList.remove('hidden');
        } else if (data.status === 'ARRIVED') {
          warnEl.innerText = '⚠️ الكابتن وصل — الإلغاء الآن يخصم 0.50 د.أ'; warnEl.className = 'bg-amber-50 text-amber-900 text-[11px] font-bold text-center py-1 rounded-lg'; warnEl.classList.remove('hidden');
        } else if (Number(data.captainMovedKm || 0) >= 2.0 && data.status === 'ACCEPTED') {
          warnEl.innerText = `⚠️ الكابتن تحرك (${Number(data.captainMovedKm).toFixed(1)} كم) — الإلغاء يخصم 0.50 د.أ`; warnEl.className = 'bg-amber-50 text-amber-900 text-[11px] font-bold text-center py-1 rounded-lg'; warnEl.classList.remove('hidden');
        } else warnEl.classList.add('hidden');

        if (data.status === 'SEARCHING') badge.innerText = data.targetCaptainId === 'ALL' ? `جاري عرض الطلب لكباتن ${data.city || ''}... 🛵` : `موجه لأقرب كابتن (${(data.dispatchIndex || 0) + 1})... 🛵`;

        if (data.status !== lastRideStatus) {
          const prev = lastRideStatus; lastRideStatus = data.status;
          if (data.status !== 'SEARCHING' && dispatchInterval) clearInterval(dispatchInterval);
          if (['ACCEPTED', 'ARRIVED', 'ON_TRIP'].includes(data.status)) {
            document.getElementById('captain-info-box').classList.remove('hidden');
            document.getElementById('rider-chat-box').classList.remove('hidden');
            document.getElementById('cap-info-name').innerText = `الكابتن ${data.captainName}`;
            document.getElementById('cap-info-bike').innerText = `${data.bikeModel} • ${data.plate}`;
            document.getElementById('cap-call-link').href = `tel:${data.captainPhone}`;
          }
          if (data.status === 'ACCEPTED') { badge.innerText = 'الكابتن في طريقه إليك!'; if (prev !== null) notifyRider('🛵 تم قبول رحلتك!', `الكابتن ${data.captainName} في طريقه إليك`, 'status'); }
          else if (data.status === 'ARRIVED') { badge.innerText = 'الكابتن وصل لموقعك 📍'; if (prev !== null) notifyRider('📍 الكابتن وصل!', `${data.captainName} ينتظرك بالخارج`, 'status'); }
          else if (data.status === 'ON_TRIP') { badge.innerText = 'الرحلة جارية 💨'; if (prev !== null) notifyRider('💨 انطلقت الرحلة', 'رحلة آمنة مع نشمي بايك', 'status'); }
          else if (data.status === 'COMPLETED') {
            appliedPromo = null; document.getElementById('promo-input').value = '';
            const finishedId = activeRideId; resetRideWatchers(); activeRideId = null; lastCompletedRideId = finishedId;
            selectStars(5); document.getElementById('rating-comment').value = '';
            notifyRider('🎉 وصلت بالسلامة!', `الأجرة: ${Number(data.fareJod).toFixed(2)} د.أ • قيّم رحلتك`, 'status');
            document.getElementById('rider-panel-active').classList.add('hidden');
            document.getElementById('rider-panel-rating').classList.remove('hidden');
            document.getElementById('rating-summary').innerText = `الكابتن ${data.captainName} • ${Number(data.fareJod).toFixed(2)} د.أ (${data.paymentMethod})`;
          } else if (data.status === 'CANCELLED_NO_SHOW') { notifyRider('⚠️ تم إلغاء الرحلة', 'انتهت مهلة 5 دقائق وخصم 0.50 د.أ', 'status'); resetRiderUI(); }
          else if (data.status === 'CANCELLED') resetRiderUI();
        }
      });
      listenChat(activeRideId);
    }

    window.requestRide = async () => {
      unlockAudio();
      if (!dropoffCoords) return alert('اختر وجهتك أولاً');
      if (currentDistKm > MAX_RIDE_KM) return alert(`⚠️ الحد الأقصى للرحلة ${MAX_RIDE_KM} كم فقط.`);
      const payMethod = document.getElementById('payment-method').value;
      const debt = currentUser.walletBalance < 0 ? +Math.abs(currentUser.walletBalance).toFixed(2) : 0;
      const origFare = origFares[selectedTier], finalFare = +(fares[selectedTier] + debt).toFixed(2), discAmount = +(origFare - fares[selectedTier]).toFixed(2);
      if (payMethod === 'محفظة نشمي' && currentUser.walletBalance < finalFare) return alert('رصيد المحفظة غير كافٍ');

      const btn = document.getElementById('btn-request-ride'); btn.innerText = 'جاري توجيه الطلب بسرعة...'; btn.disabled = true;
      const cityAr = CITIES[currentCity].nameAr, queueIds = await buildFastDispatchQueue(cityAr), firstTarget = queueIds.length > 0 ? queueIds[0] : 'ALL';

      const newRide = {
        riderId: currentUser.id, riderName: currentUser.name, riderPhone: currentUser.phone, city: cityAr, tier: selectedTier,
        originalFareJod: origFare, fareJod: finalFare, discountJod: discAmount, settledDebtJod: debt,
        promoCode: appliedPromo ? appliedPromo.code : null, companyPaysPromo: appliedPromo ? appliedPromo.companyPays : false,
        distanceKm: Number(currentDistKm.toFixed(1)), pickupAddress, dropoffAddress,
        pickupLat: pickupCoords[0], pickupLng: pickupCoords[1], dropoffLat: dropoffCoords[0], dropoffLng: dropoffCoords[1],
        paymentMethod: payMethod, extraHelmet: document.getElementById('extra-helmet').checked,
        dispatchQueue: queueIds, dispatchIndex: 0, targetCaptainId: firstTarget, captainMovedKm: 0, financialSettled: false, status: 'SEARCHING', createdAt: serverTimestamp()
      };
      const rideDoc = await addDoc(collection(db, 'rides'), newRide);
      btn.innerText = dict[lang].orderBtn; btn.disabled = false;

      if (dispatchInterval) clearInterval(dispatchInterval);
      let dIdx = 0;
      // توجيه سريع جداً كل 7 ثوانٍ بدلاً من 15 ثانية
      dispatchInterval = setInterval(async () => {
        if (!activeRideId || lastRideStatus !== 'SEARCHING') { clearInterval(dispatchInterval); return; }
        dIdx++;
        if (dIdx < queueIds.length) await updateDoc(doc(db, 'rides', activeRideId), { dispatchIndex: dIdx, targetCaptainId: queueIds[dIdx] }).catch(() => {});
        else { await updateDoc(doc(db, 'rides', activeRideId), { targetCaptainId: 'ALL' }).catch(() => {}); clearInterval(dispatchInterval); }
      }, 7000);

      attachToRide(rideDoc.id, newRide);
    };

    window.cancelRideRider = async () => {
      if (!activeRideId) return;
      const mKm = Number(activeRideData?.captainMovedKm || 0), isLate = activeRideData?.arrivalDeadlineMs && Date.now() > activeRideData.arrivalDeadlineMs;
      const capFault = !!(activeRideData?.captainPenaltyApplied || activeRideData?.waitPaused || isLate);
      const hasPenalty = activeRideData && !capFault && (activeRideData.status === 'ARRIVED' || mKm >= 2.0);
      if (hasPenalty && !confirm('⚠️ الكابتن وصل (أو تحرك +2 كم). الإلغاء يخصم 0.50 د.أ تعويضاً للكابتن. هل تريد المتابعة؟')) return;

      const btn = document.getElementById('btn-rider-cancel'); btn.disabled = true;
      const rRef = doc(db, 'rides', activeRideId);
      try {
        const res = await runTransaction(db, async (tx) => {
          const rSnap = await tx.get(rRef); if (!rSnap.exists()) return { ok: false };
          const rd = rSnap.data(); if (!['SEARCHING', 'ACCEPTED', 'ARRIVED'].includes(rd.status) || rd.financialSettled) return { ok: false };
          const riderSnap = await tx.get(doc(db, 'riders', currentUser.id));
          let capSnap = null; if (rd.captainId) capSnap = await tx.get(doc(db, 'captains', rd.captainId));
          const late = rd.arrivalDeadlineMs && Date.now() > rd.arrivalDeadlineMs, fault = !!(rd.captainPenaltyApplied || rd.waitPaused || late);
          const penalize = !fault && (rd.status === 'ARRIVED' || Number(rd.captainMovedKm || 0) >= 2.0);

          if (penalize) {
            tx.update(doc(db, 'riders', currentUser.id), { walletBalance: +(Number(riderSnap.data()?.walletBalance || 0) - 0.50).toFixed(2) });
            if (capSnap && capSnap.exists()) tx.update(doc(db, 'captains', rd.captainId), { walletBalance: +(Number(capSnap.data()?.walletBalance || 0) + 0.50).toFixed(2) });
            tx.update(rRef, { status: 'CANCELLED', cancelFeeJod: 0.50, cancelledBy: 'RIDER', financialSettled: true });
            return { ok: true, charged: true };
          }
          tx.update(rRef, { status: 'CANCELLED', cancelFeeJod: 0, cancelledBy: 'RIDER', financialSettled: true });
          return { ok: true, charged: false };
        });
        if (res?.charged) notifyRider('تم إلغاء الطلب', 'تم خصم 0.50 د.أ تعويضاً للكابتن', 'status');
      } finally { btn.disabled = false; resetRiderUI(); }
    };

    function resetRideWatchers() {
      keepAwake(false);
      if (unsubRide) unsubRide(); if (unsubChat) unsubChat();
      if (waitInterval) clearInterval(waitInterval); if (arrivalInterval) clearInterval(arrivalInterval); if (dispatchInterval) clearInterval(dispatchInterval);
      if (capMarker && map) { map.removeLayer(capMarker); capMarker = null; }
    }
    function resetRiderUI() {
      resetRideWatchers(); activeRideId = null; activeRideData = null; lastRideStatus = null; dropoffCoords = null;
      if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; }
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      ['captain-info-box', 'rider-chat-box', 'rider-wait-timer', 'rider-arrival-timer', 'rider-cancel-warning', 'rider-panel-active', 'rider-panel-rating', 'rider-panel-book'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById('rider-panel-dest').classList.remove('hidden');
      if (pickupCoords) map.setView(pickupCoords, 15);
    }

    window.selectStars = (n) => {
      chosenStars = n;
      for (let i = 1; i <= 5; i++) {
        const el = document.getElementById('star-' + i);
        el.className = i <= n ? 'scale-110 transition' : 'opacity-30 transition';
      }
    };
    window.submitRating = async () => {
      if (lastCompletedRideId) {
        const comment = document.getElementById('rating-comment').value.trim();
        await updateDoc(doc(db, 'rides', lastCompletedRideId), { rating: chosenStars, ratingComment: comment || null });
      }
      lastCompletedRideId = null; resetRiderUI();
    };
    window.skipRating = () => { lastCompletedRideId = null; resetRiderUI(); };

    window.shareRide = async () => { const t = `رحلتي مع NshmiBike 🇯🇴 رقم: ${activeRideId}`; if (navigator.share) { try { await navigator.share({ text: t }); } catch (e) {} } else alert(t); };
    window.triggerSOS = async () => { await addDoc(collection(db, 'sos_alerts'), { userId: currentUser?.id || 'guest', rideId: activeRideId || null, createdAt: serverTimestamp() }); if (confirm('🚨 تم إرسال تنبيه SOS.\nهل تريد الاتصال بـ 911؟')) window.location.href = 'tel:911'; };

    function listenChat(rideId) {
      if (unsubChat) unsubChat(); let firstLoad = true;
      const q = query(collection(db, 'rides', rideId, 'messages'), orderBy('createdAt', 'asc'));
      unsubChat = onSnapshot(q, (snap) => {
        const box = document.getElementById('rider-messages'); box.innerHTML = '';
        snap.forEach((m) => {
          const d = m.data(), div = document.createElement('div'); div.className = 'bg-white px-2 py-1 rounded-lg border border-slate-100';
          const s = document.createElement('span'); s.className = 'font-bold text-[#007A3D]'; s.textContent = d.senderName + ': ';
          const t = document.createElement('span'); t.textContent = d.text; div.appendChild(s); div.appendChild(t); box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
        if (!firstLoad) snap.docChanges().forEach((c) => { if (c.type === 'added' && c.doc.data().role !== 'RIDER') notifyRider('💬 رسالة من الكابتن', c.doc.data().text, 'chat'); });
        firstLoad = false;
      });
    }
    window.sendChat = async () => {
      if (!activeRideId) return;
      const inp = document.getElementById('rider-chat-input'), text = inp.value.trim(); if (!text) return; inp.value = '';
      await addDoc(collection(db, 'rides', activeRideId, 'messages'), { senderName: currentUser.name, role: 'RIDER', text, createdAt: serverTimestamp() });
    };
  </script>
</body>
</html>
