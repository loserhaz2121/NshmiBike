<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#007A3D" />
  <link rel="manifest" href="manifest.json" />
  <title>NshmiBike 🇯🇴</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background: #0f172a; }
    #map { height: 100%; width: 100%; z-index: 1; }
    .jo-green { background-color: #007A3D; }
    .jo-text { color: #007A3D; }
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 36px) !important; }
    .shmagh-strip {
      height: 6px;
      background: repeating-linear-gradient(45deg, #CE1126, #CE1126 8px, #ffffff 8px, #ffffff 16px);
    }
    .gps-dot {
      width: 16px; height: 16px; background: #2563eb; border: 3px solid #fff;
      border-radius: 50%; box-shadow: 0 0 0 8px rgba(37, 99, 235, 0.25);
    }
  </style>
</head>
<body class="min-h-screen flex justify-center bg-slate-900">

  <div id="toast-banner" class="hidden fixed top-3 left-1/2 -translate-x-1/2 z-[60] w-[92%] max-w-[400px] bg-slate-900 text-white p-3.5 rounded-2xl shadow-2xl border-r-4 border-[#CE1126]">
    <div id="toast-title" class="font-extrabold text-xs text-emerald-400"></div>
    <div id="toast-body" class="text-xs mt-0.5"></div>
  </div>

  <div class="w-full max-w-[440px] h-screen bg-white flex flex-col relative shadow-2xl overflow-hidden">

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="screen-login" class="flex-1 flex flex-col justify-center p-5 bg-gradient-to-b from-emerald-50 via-white to-red-50/40 relative overflow-y-auto safe-bottom">
      <div class="shmagh-strip absolute top-0 left-0 right-0"></div>
      <div class="flex justify-end mb-2">
        <button onclick="toggleLanguage()" class="bg-white border border-slate-200 px-3 py-1 rounded-full text-xs font-extrabold text-slate-700 shadow-sm">
          🌐 <span class="lang-switch-label">English</span>
        </button>
      </div>
      <div class="text-center mb-4">
        <div class="w-16 h-16 jo-green rounded-3xl mx-auto flex items-center justify-center text-3xl shadow-lg mb-2 border-2 border-[#CE1126]">🛵</div>
        <h1 class="text-2xl font-extrabold text-slate-900">Nshmi<span class="text-[#CE1126]">Bike</span> 🇯🇴</h1>
        <p data-i18n="tagline" class="text-[11px] text-slate-600 font-semibold mt-0.5">عمّان • إربد • الزرقاء | أوفر من السيارة بـ 50%</p>
      </div>

      <div class="bg-white p-4 rounded-3xl shadow-lg border border-slate-100 space-y-2.5">
        <div>
          <label data-i18n="emailLabel" class="block text-[11px] font-bold text-slate-700 mb-1">البريد الإلكتروني</label>
          <input id="login-email" type="email" placeholder="example@gmail.com" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm text-left" dir="ltr">
        </div>
        <div>
          <label data-i18n="passLabel" class="block text-[11px] font-bold text-slate-700 mb-1">كلمة المرور (6 أحرف فأكثر)</label>
          <input id="login-pass" type="password" placeholder="******" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm text-left" dir="ltr">
        </div>
        <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-100">
          <div>
            <label data-i18n="fullName" class="block text-[10px] font-bold text-slate-500 mb-1">الاسم (للتسجيل الجديد)</label>
            <input id="login-name" type="text" placeholder="مثال: يزيد" class="w-full border border-slate-200 rounded-xl px-2.5 py-2 text-xs">
          </div>
          <div>
            <label data-i18n="phoneLabel" class="block text-[10px] font-bold text-slate-500 mb-1">الهاتف (للتسجيل الجديد)</label>
            <input id="login-phone" type="tel" placeholder="079xxxxxxx" class="w-full border border-slate-200 rounded-xl px-2.5 py-2 text-xs text-left" dir="ltr">
          </div>
        </div>
        <div class="flex items-center justify-between text-xs pt-1">
          <label class="flex items-center gap-1.5 font-bold text-slate-700 cursor-pointer">
            <input id="remember-me" type="checkbox" checked class="accent-[#007A3D] w-4 h-4">
            <span data-i18n="rememberMe">تذكرني عند الدخول</span>
          </label>
          <button type="button" onclick="resetPassword()" class="text-[#CE1126] font-bold underline text-[11px]">نسيت كلمة المرور؟</button>
        </div>
        <button onclick="loginRider()" id="btn-login" data-i18n="loginBtn" class="w-full jo-green text-white font-extrabold py-3 rounded-2xl shadow-lg text-sm">
          دخول / تسجيل حساب جديد 🔔
        </button>
        <p id="login-error" class="text-xs text-red-600 font-bold text-center hidden"></p>
      </div>
    </div>

    <!-- 2. الشاشة الرئيسية للعميل -->
    <div id="screen-rider" class="hidden flex-1 flex flex-col h-full relative">
      <div class="shmagh-strip shrink-0"></div>
      <header class="p-3 bg-white shadow-sm flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center gap-2">
          <button onclick="toggleDrawer(true)" class="w-9 h-9 bg-slate-100 rounded-xl flex items-center justify-center text-lg font-bold text-slate-800">☰</button>
          <div>
            <div class="font-extrabold text-slate-900 text-sm leading-tight">Nshmi<span class="text-[#CE1126]">Bike</span> 🇯🇴</div>
            <div id="city-badge" class="text-[10px] jo-text font-extrabold">📍 جاري تحديد مدينتك...</div>
          </div>
        </div>
        <div class="flex gap-1.5">
          <button onclick="toggleLanguage()" class="bg-slate-100 text-slate-700 text-[11px] font-extrabold px-2.5 py-1 rounded-full lang-switch-label">EN</button>
          <button onclick="testAudio()" class="bg-emerald-50 text-[#007A3D] text-[11px] font-bold px-2 py-1 rounded-full">🔔</button>
          <button onclick="triggerSOS()" class="bg-[#CE1126] text-white text-[11px] font-bold px-2.5 py-1 rounded-full">🆘 SOS</button>
        </div>
      </header>

      <!-- الخريطة بنمط Google Maps -->
      <div class="relative flex-1 bg-slate-100">
        <div id="map"></div>
        <div class="absolute top-3 left-3 right-3 z-10 flex justify-between items-center pointer-events-none">
          <select id="city-filter" onchange="switchCity(this.value)" class="pointer-events-auto bg-white/95 backdrop-blur px-3 py-1.5 rounded-full shadow-md text-xs font-extrabold text-slate-800 border border-slate-100 focus:outline-none">
            <option value="amman">🏙️ عمّان</option>
            <option value="irbid">🏙️ إربد</option>
            <option value="zarqa">🏙️ الزرقاء</option>
          </select>
          <button onclick="useMyGPS()" class="pointer-events-auto bg-white/95 backdrop-blur px-3 py-1.5 rounded-full shadow-md text-xs font-extrabold text-blue-600 border border-slate-100">
            🎯 موقعي GPS
          </button>
        </div>
      </div>

      <!-- الخطوة أ: اختيار الوجهة -->
      <div id="rider-panel-dest" class="bg-white rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.12)] px-4 pt-3 safe-bottom z-20 shrink-0 space-y-2.5">
        <div id="debt-notice" class="hidden bg-red-50 text-[#CE1126] text-[10px] font-extrabold text-center py-1 rounded-lg"></div>
        <div class="flex items-center gap-2 text-xs font-bold text-slate-600 bg-blue-50/70 px-3 py-2 rounded-xl">
          <span class="w-2.5 h-2.5 rounded-full bg-blue-600 inline-block shrink-0"></span>
          <span id="pickup-label" class="truncate">انطلاقك: جاري تحديد موقعك تلقائياً عبر GPS...</span>
        </div>

        <div class="flex gap-1.5">
          <input id="dest-search" type="text" placeholder="🔍 إلى أين تريد الذهاب؟ (أو اضغط على الخريطة)" class="flex-1 bg-slate-100 rounded-2xl px-3.5 py-2.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-[#007A3D]">
          <button onclick="searchPlace()" class="jo-green text-white px-4 rounded-2xl text-xs font-extrabold">بحث</button>
        </div>

        <div id="search-results" class="hidden max-h-32 overflow-y-auto space-y-1 bg-slate-50 p-2 rounded-2xl border border-slate-100"></div>

        <div>
          <div id="quick-city-title" class="text-[11px] font-extrabold text-slate-500 mb-1.5">أو اختر وجهة قريبة في مدينتك:</div>
          <div id="quick-places" class="flex gap-1.5 overflow-x-auto pb-1"></div>
        </div>
      </div>

      <!-- الخطوة ب: تأكيد السعر والطلب -->
      <div id="rider-panel-book" class="hidden bg-white rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.14)] px-4 pt-3 safe-bottom z-20 shrink-0">
        <div class="flex items-center justify-between mb-2">
          <div class="text-xs font-extrabold text-slate-800 truncate flex-1">📍 إلى: <span id="chosen-dest-label" class="jo-text"></span></div>
          <button onclick="backToDestStep()" class="text-[11px] bg-slate-100 px-2.5 py-1 rounded-full font-bold text-slate-600">✏️ تغيير</button>
        </div>

        <div class="grid grid-cols-3 gap-1.5 mb-2">
          <button onclick="selectTier('SCOOTER')" id="tier-SCOOTER" class="tier-btn border-2 border-[#007A3D] bg-emerald-50 rounded-xl p-1.5 text-center">
            <div class="text-base">🛵</div>
            <div data-i18n="tierScooter" class="text-[10px] font-extrabold">نشمي سكوتر</div>
            <div id="price-SCOOTER" class="text-xs font-extrabold jo-text">0.60 د.أ</div>
          </button>
          <button onclick="selectTier('BIKE')" id="tier-BIKE" class="tier-btn border border-slate-200 bg-white rounded-xl p-1.5 text-center">
            <div class="text-base">🏍️</div>
            <div data-i18n="tierBike" class="text-[10px] font-extrabold">نشمي بايك</div>
            <div id="price-BIKE" class="text-xs font-extrabold text-slate-700">0.75 د.أ</div>
          </button>
          <button onclick="selectTier('EXPRESS')" id="tier-EXPRESS" class="tier-btn border border-slate-200 bg-white rounded-xl p-1.5 text-center">
            <div class="text-base">📦</div>
            <div data-i18n="tierExpress" class="text-[10px] font-extrabold">طرود سريعة</div>
            <div id="price-EXPRESS" class="text-xs font-extrabold text-slate-700">0.70 د.أ</div>
          </button>
        </div>

        <div id="car-savings-badge" class="bg-emerald-50 text-[#007A3D] text-[10px] font-bold text-center py-1 rounded-lg mb-1.5"></div>

        <div class="flex gap-1.5 mb-1.5">
          <input id="promo-input" type="text" placeholder="كود الخصم / Promo" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1 text-xs uppercase font-bold">
          <button onclick="applyPromo()" data-i18n="applyBtn" class="bg-slate-900 text-white px-3 rounded-xl text-xs font-bold">تطبيق</button>
        </div>

        <div class="flex items-center justify-between text-[11px] mb-2">
          <label class="flex items-center gap-1 font-bold text-slate-700">
            <input id="extra-helmet" type="checkbox" checked class="accent-[#007A3D] w-3.5 h-3.5">
            <span data-i18n="helmetReq">🪖 خوذة معقمة</span>
          </label>
          <select id="payment-method" class="bg-slate-100 px-2 py-1 rounded-lg font-bold text-slate-700">
            <option value="كاش">💵 كاش / Cash</option>
            <option value="محفظة نشمي">👛 المحفظة / Wallet</option>
            <option value="زين كاش">📱 زين كاش</option>
            <option value="CliQ">🏦 CliQ</option>
          </select>
        </div>

        <button onclick="requestRide()" data-i18n="orderBtn" class="w-full jo-green text-white font-extrabold py-3 rounded-2xl shadow-lg text-sm">
          اطلب NshmiBike الآن 🇯🇴
        </button>
      </div>

      <!-- لوحة الرحلة النشطة -->
      <div id="rider-panel-active" class="hidden bg-white rounded-t-3xl shadow-2xl px-4 pt-4 safe-bottom z-20 space-y-2.5 shrink-0">
        <div class="flex justify-between items-center">
          <span id="rider-ride-status" class="bg-amber-100 text-amber-800 text-xs font-extrabold px-3 py-1 rounded-full">جاري البحث عن كابتن...</span>
          <span id="rider-ride-fare" class="font-extrabold text-slate-800 text-sm"></span>
        </div>
        <div id="rider-wait-timer" class="hidden bg-red-50 text-[#CE1126] text-xs font-extrabold text-center py-1.5 rounded-xl"></div>
        <div id="rider-cancel-warning" class="hidden bg-amber-50 text-amber-900 text-[11px] font-bold text-center py-1 rounded-lg"></div>

        <div id="captain-info-box" class="hidden bg-slate-50 p-2.5 rounded-2xl border border-slate-100 flex justify-between items-center">
          <div>
            <div id="cap-info-name" class="font-extrabold text-sm text-slate-800"></div>
            <div id="cap-info-bike" class="text-xs text-slate-500"></div>
          </div>
          <div class="flex gap-1.5">
            <button onclick="shareRide()" class="bg-white border px-2.5 py-1.5 rounded-xl text-xs font-bold">🔗</button>
            <a id="cap-call-link" href="#" class="jo-green text-white px-2.5 py-1.5 rounded-xl text-xs font-bold">📞</a>
          </div>
        </div>
        <div id="rider-chat-box" class="hidden border border-slate-100 rounded-2xl p-2 bg-slate-50">
          <div id="rider-messages" class="max-h-24 overflow-y-auto text-xs space-y-1 mb-2"></div>
          <div class="flex gap-1">
            <input id="rider-chat-input" type="text" placeholder="راسل الكابتن..." class="flex-1 bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs">
            <button onclick="sendChat()" class="jo-green text-white px-3 rounded-xl text-xs font-bold">إرسال</button>
          </div>
        </div>
        <button onclick="cancelRideRider()" data-i18n="cancelBtn" class="w-full bg-slate-100 text-slate-700 font-bold py-2.5 rounded-xl text-xs">إلغاء الطلب</button>
      </div>

      <!-- لوحة التقييم -->
      <div id="rider-panel-rating" class="hidden bg-white rounded-t-3xl shadow-2xl px-5 pt-5 safe-bottom z-20 text-center space-y-3 shrink-0">
        <div class="text-3xl">🎉</div>
        <h3 data-i18n="arrivedSafe" class="font-extrabold text-slate-800 text-base">الحمد لله على السلامة!</h3>
        <p id="rating-summary" class="text-xs text-slate-500 font-semibold"></p>
        <div class="flex justify-center gap-2 text-2xl">
          <button onclick="rateRide(1)">⭐</button><button onclick="rateRide(2)">⭐</button>
          <button onclick="rateRide(3)">⭐</button><button onclick="rateRide(4)">⭐</button><button onclick="rateRide(5)">⭐</button>
        </div>
        <button onclick="rateRide(5)" data-i18n="newRideBtn" class="w-full jo-green text-white font-extrabold py-3 rounded-2xl text-sm">حجز رحلة جديدة</button>
      </div>

      <!-- القائمة الجانبية -->
      <div id="drawer-backdrop" onclick="toggleDrawer(false)" class="hidden fixed inset-0 bg-black/50 z-40"></div>
      <aside id="side-drawer" class="hidden fixed top-0 bottom-0 w-[80%] max-w-[310px] bg-white z-50 flex flex-col shadow-2xl overflow-y-auto safe-bottom">
        <div class="shmagh-strip shrink-0"></div>
        <div class="bg-gradient-to-br from-[#007A3D] to-slate-900 text-white p-5 flex items-center gap-3">
          <div id="drawer-avatar" class="w-14 h-14 rounded-full bg-white/20 border-2 border-white flex items-center justify-center text-2xl font-extrabold">ن</div>
          <div class="overflow-hidden">
            <div id="drawer-name" class="font-extrabold text-base truncate"></div>
            <div id="drawer-phone" class="text-xs text-emerald-200 font-semibold" dir="ltr"></div>
            <div id="drawer-email" class="text-[10px] text-white/75 truncate" dir="ltr"></div>
          </div>
        </div>

        <nav class="flex-1 py-2 divide-y divide-slate-100 text-sm font-bold text-slate-700">
          <button onclick="openModal('profile')" class="w-full px-5 py-3 flex items-center gap-3 hover:bg-slate-50"><span>👤</span><span data-i18n="mProfile">الملف الشخصي</span></button>
          <button onclick="openModal('trips')" class="w-full px-5 py-3 flex items-center gap-3 hover:bg-slate-50"><span>🕒</span><span data-i18n="mTrips">رحلاتي</span></button>
          <button onclick="openModal('wallet')" class="w-full px-5 py-3 flex items-center justify-between hover:bg-slate-50">
            <span class="flex items-center gap-3"><span>💳</span><span data-i18n="mWallet">المحفظة</span></span>
            <span id="drawer-wallet-val" class="text-xs font-extrabold jo-text">0.00 د.أ</span>
          </button>
          <button onclick="openModal('inbox')" class="w-full px-5 py-3 flex items-center gap-3 hover:bg-slate-50"><span>📬</span><span data-i18n="mInbox">صندوق الرسائل والعروض</span></button>
          <button onclick="openModal('invite')" class="w-full px-5 py-3 flex items-center gap-3 hover:bg-slate-50"><span>👥</span><span data-i18n="mInvite">دعوة الأصدقاء</span></button>
          <button onclick="openModal('referral')" class="w-full px-5 py-3 flex items-center gap-3 hover:bg-slate-50"><span>🏷️</span><span data-i18n="mReferral">كود الإحالة والمكافآت</span></button>
          <button onclick="openModal('contact')" class="w-full px-5 py-3 flex items-center gap-3 hover:bg-slate-50"><span>🎧</span><span data-i18n="mContact">تواصل معنا</span></button>
          <button onclick="openModal('settings')" class="w-full px-5 py-3 flex items-center gap-3 hover:bg-slate-50"><span>⚙️</span><span data-i18n="mSettings">الإعدادات واللغة</span></button>
          <button onclick="openModal('terms')" class="w-full px-5 py-3 flex items-center gap-3 hover:bg-slate-50"><span>❓</span><span data-i18n="mTerms">الشروط والأحكام</span></button>
          <button onclick="openModal('diag')" class="w-full px-5 py-3 flex items-center gap-3 hover:bg-slate-50"><span>🛠️</span><span data-i18n="mDiag">فحص الاتصال</span></button>
        </nav>

        <div class="p-4 border-t border-slate-100">
          <button onclick="logout()" class="w-full text-right text-[#CE1126] font-extrabold text-sm py-1" data-i18n="logout">تسجيل الخروج</button>
          <div class="text-[11px] text-slate-400 mt-1">NshmiBike Jordan • v2.3.0 🇯🇴</div>
        </div>
      </aside>

      <div id="app-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center">
        <div class="w-full max-w-[440px] bg-white rounded-t-3xl sm:rounded-3xl px-5 pt-5 safe-bottom max-h-[85vh] overflow-y-auto space-y-4">
          <div class="flex justify-between items-center border-b pb-2.5">
            <h3 id="modal-title" class="font-extrabold text-base text-slate-800"></h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 font-bold">✕</button>
          </div>
          <div id="modal-body" class="text-xs text-slate-700 space-y-3"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, doc, getDoc, getDocs, setDoc, updateDoc,
      onSnapshot, query, where, serverTimestamp, orderBy, increment
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXa39YZfFdLQ48CYgjHNSHI1mlIRuA1UU",
      authDomain: "nshmibike.firebaseapp.com",
      databaseURL: "https://nshmibike-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nshmibike",
      storageBucket: "nshmibike.firebasestorage.app",
      messagingSenderId: "506031565051",
      appId: "1:506031565051:web:fc915e5a2173e841c7a85e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const CITIES = {
      amman: {
        nameAr: 'عمّان', nameEn: 'Amman', center: [31.9539, 35.9106],
        places: [
          { name: 'العبدلي / البوليفارد', coords: [31.9648, 35.9080] },
          { name: 'الجامعة الأردنية', coords: [32.0160, 35.8695] },
          { name: 'الدوار السابع', coords: [31.9531, 35.8594] },
          { name: 'الصويفية', coords: [31.9566, 35.8511] },
          { name: 'وسط البلد', coords: [31.9516, 35.9393] },
          { name: 'سيتي مول', coords: [31.9815, 35.8390] },
          { name: 'مكة مول', coords: [31.9762, 35.8444] }
        ]
      },
      irbid: {
        nameAr: 'إربد', nameEn: 'Irbid', center: [32.5568, 35.8469],

    function playTone(kind) {
      try {
        unlockAudio(); if (!audioCtx) return;
        const notes = kind === 'chat' ? [880, 1175] : [587, 784, 988];
        notes.forEach((f, i) => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.frequency.value = f;
          g.gain.setValueAtTime(0.25, audioCtx.currentTime + i * 0.13);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.13 + 0.28);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(audioCtx.currentTime + i * 0.13); o.stop(audioCtx.currentTime + i * 0.13 + 0.3);
        });
      } catch (e) {}
    }

    function haversine(c1, c2) {
      const R = 6371, dLat = (c2[0]-c1[0])*Math.PI/180, dLon = (c2[1]-c1[1])*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(c1[0]*Math.PI/180)*Math.cos(c2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function detectClosestCity(coords) {
      let best = 'amman', bestDist = 9999;
      for (const [key, c] of Object.entries(CITIES)) {
        const d = haversine(coords, c.center);
        if (d < bestDist) { bestDist = d; best = key; }
      }
      return best;
    }

      try {
        const cityAr = CITIES[currentCity].nameAr;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=jo&accept-language=ar&limit=5&q=${encodeURIComponent(q + ' ' + cityAr)}`);
        const data = await res.json();
        if (!data.length) { box.innerHTML = '<div class="text-xs text-red-500 p-2">لم نجد نتائج، جرّب الضغط على الخريطة</div>'; return; }
        box.innerHTML = '';
        data.forEach((item) => {
          const btn = document.createElement('button');
          btn.className = 'w-full text-right bg-white p-2 rounded-xl border border-slate-100 text-xs font-bold hover:bg-emerald-50';
          btn.innerText = '📍 ' + item.display_name.split(',').slice(0, 3).join('، ');
          btn.onclick = () => {
            box.classList.add('hidden');
            pickDestination([Number(item.lat), Number(item.lon)], item.display_name.split(',')[0]);
          };
          box.appendChild(btn);
        });
      } catch (e) { box.innerHTML = '<div class="text-xs text-red-500 p-2">اضغط مباشرة على الخريطة لتحديد الوجهة</div>'; }
    };

    window.pickDestination = (coords, label) => {
      dropoffCoords = coords;
      dropoffAddress = label;
      document.getElementById('chosen-dest-label').innerText = label;
      document.getElementById('rider-panel-dest').classList.add('hidden');
      document.getElementById('rider-panel-book').classList.remove('hidden');
      updateRoute();
    };

    window.backToDestStep = () => {
      document.getElementById('rider-panel-book').classList.add('hidden');
      document.getElementById('rider-panel-dest').classList.remove('hidden');
      if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; }
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      dropoffCoords = null;
      if (pickupCoords) map.setView(pickupCoords, 15);
    };

    window.applyPromo = async () => {
      const code = document.getElementById('promo-input').value.trim().toUpperCase();
      if (!code) return;
      const snap = await getDoc(doc(db, 'promos', code));
      if (!snap.exists() || !snap.data().active) { activeDiscountPct = 0; updateRoute(); return alert('كود غير صالح'); }
      activeDiscountPct = Number(snap.data().discountPct || 0); updateRoute();
      alert(`🎉 تم تفعيل خصم ${activeDiscountPct}%`);
    };

    window.updateRoute = () => {
      if (!map || !dropoffCoords) return;
      if (dropoffMarker) map.removeLayer(dropoffMarker);
      if (routeLine) map.removeLayer(routeLine);

      dropoffMarker = L.circleMarker(dropoffCoords, { radius: 9, color: '#CE1126', fillColor: '#CE1126', fillOpacity: 1 }).addTo(map);
      routeLine = L.polyline([pickupCoords, dropoffCoords], { color: '#007A3D', weight: 4, dashArray: '8, 8' }).addTo(map);
      map.fitBounds([pickupCoords, dropoffCoords], { padding: [55, 55] });

      currentDistKm = Math.max(0.8, haversine(pickupCoords, dropoffCoords) * 1.28);
      const mult = 1 - (activeDiscountPct / 100);
      fares.SCOOTER = Math.max(0.40, +(Math.max(pricing.scooterMin, pricing.scooterBase + currentDistKm * pricing.scooterPerKm) * mult).toFixed(2));
      fares.BIKE = Math.max(0.50, +(Math.max(pricing.bikeMin || 0.75, pricing.bikeBase + currentDistKm * pricing.bikePerKm) * mult).toFixed(2));
      fares.EXPRESS = Math.max(0.45, +(Math.max(0.70, pricing.scooterBase + currentDistKm * (pricing.scooterPerKm + 0.01)) * mult).toFixed(2));

      document.getElementById('price-SCOOTER').innerText = fares.SCOOTER.toFixed(2) + ' د.أ';
      document.getElementById('price-BIKE').innerText = fares.BIKE.toFixed(2) + ' د.أ';
      document.getElementById('price-EXPRESS').innerText = fares.EXPRESS.toFixed(2) + ' د.أ';

      const estCar = Math.max(1.50, +(0.47 + currentDistKm * 0.34 + 0.30).toFixed(2));
      const saved = Math.max(0.50, +(estCar - fares[selectedTier]).toFixed(2));
      document.getElementById('car-savings-badge').innerText = `المسافة ${currentDistKm.toFixed(1)} كم • توفر ~${saved.toFixed(2)} د.أ عن السيارة!`;
    };

    window.selectTier = (tier) => {
      selectedTier = tier;
      document.querySelectorAll('.tier-btn').forEach(b => b.className = 'tier-btn border border-slate-200 bg-white rounded-xl p-1.5 text-center');
      document.getElementById('tier-' + tier).className = 'tier-btn border-2 border-[#007A3D] bg-emerald-50 rounded-xl p-1.5 text-center';
      updateRoute();
    };

    function startWaitCountdown(arrivedAtMs) {
      if (waitInterval) clearInterval(waitInterval);
      const timerEl = document.getElementById('rider-wait-timer'); timerEl.classList.remove('hidden');
      const update = () => {
        const leftSec = Math.max(0, 300 - Math.floor((Date.now() - arrivedAtMs) / 1000));
        const m = String(Math.floor(leftSec / 60)).padStart(2, '0'), s = String(leftSec % 60).padStart(2, '0');
        timerEl.innerText = leftSec > 0 ? `⏱️ الكابتن بانتظارك: ${m}:${s} (بعدها يحق للكابتن الإلغاء بـ 0.50 د.أ)` : '⚠️ انتهى وقت الانتظار المجاني (5 دقائق)';
      };
      update(); waitInterval = setInterval(update, 1000);
    }

    window.requestRide = async () => {
      unlockAudio();
      if (!dropoffCoords) return alert('اختر وجهتك أولاً');
      const payMethod = document.getElementById('payment-method').value;
      const debt = currentUser.walletBalance < 0 ? Math.abs(currentUser.walletBalance) : 0;
      const totalFare = +(fares[selectedTier] + debt).toFixed(2);
      if (payMethod === 'محفظة نشمي' && currentUser.walletBalance < fares[selectedTier]) return alert('رصيد المحفظة غير كافٍ');

      const rideDoc = await addDoc(collection(db, 'rides'), {
        riderId: currentUser.id, riderName: currentUser.name, riderPhone: currentUser.phone,
        city: CITIES[currentCity].nameAr, tier: selectedTier, fareJod: totalFare, settledDebtJod: debt,
        distanceKm: Number(currentDistKm.toFixed(1)),
        pickupAddress, dropoffAddress,
        pickupLat: pickupCoords[0], pickupLng: pickupCoords[1],
        dropoffLat: dropoffCoords[0], dropoffLng: dropoffCoords[1],
        paymentMethod: payMethod, extraHelmet: document.getElementById('extra-helmet').checked,
        captainMovedKm: 0, status: 'SEARCHING', createdAt: serverTimestamp()
      });

      activeRideId = rideDoc.id; lastRideStatus = 'SEARCHING';
      document.getElementById('rider-panel-book').classList.add('hidden');
      document.getElementById('rider-panel-active').classList.remove('hidden');
      document.getElementById('rider-ride-fare').innerText = totalFare.toFixed(2) + ' د.أ';

      unsubRide = onSnapshot(doc(db, 'rides', activeRideId), async (snap) => {
        const data = snap.data(); if (!data) return;
        activeRideData = data;
        const badge = document.getElementById('rider-ride-status');
        if (data.captainLat && data.captainLng && map) {
          if (capMarker) capMarker.setLatLng([data.captainLat, data.captainLng]);
          else capMarker = L.marker([data.captainLat, data.captainLng], { icon: bikeIcon }).addTo(map);
        }

        const warnEl = document.getElementById('rider-cancel-warning');
        if (Number(data.captainMovedKm || 0) >= 2.0 && ['ACCEPTED', 'ARRIVED'].includes(data.status)) {
          warnEl.innerText = `⚠️ الكابتن تحرك نحوك (${Number(data.captainMovedKm).toFixed(1)} كم) — الإلغاء يخصم 0.50 د.أ`;
          warnEl.classList.remove('hidden');
        } else warnEl.classList.add('hidden');

        if (data.status !== lastRideStatus) {
          lastRideStatus = data.status;
          if (data.status === 'ACCEPTED') {
            badge.innerText = 'الكابتن في طريقه إليك!';
            document.getElementById('captain-info-box').classList.remove('hidden');
            document.getElementById('rider-chat-box').classList.remove('hidden');
            document.getElementById('cap-info-name').innerText = `الكابتن ${data.captainName}`;
            document.getElementById('cap-info-bike').innerText = `${data.bikeModel} • ${data.plate}`;
            document.getElementById('cap-call-link').href = `tel:${data.captainPhone}`;
            notifyRider('🛵 تم قبول رحلتك!', `الكابتن ${data.captainName} في طريقه إليك`, 'status');
          } else if (data.status === 'ARRIVED') {
            badge.innerText = 'الكابتن وصل لموقعك 📍';
            startWaitCountdown(data.arrivedAtMs || Date.now());
            notifyRider('📍 الكابتن وصل!', `${data.captainName} ينتظرك بالخارج`, 'status');
          } else if (data.status === 'ON_TRIP') {
            if (waitInterval) clearInterval(waitInterval);
            document.getElementById('rider-wait-timer').classList.add('hidden');
            badge.innerText = 'الرحلة جارية 💨';
            notifyRider('💨 انطلقت الرحلة', 'رحلة آمنة مع نشمي بايك', 'status');
          } else if (data.status === 'COMPLETED') {
            if (debt > 0) await updateDoc(doc(db, 'users', currentUser.id), { walletBalance: increment(debt) });
            if (data.paymentMethod === 'محفظة نشمي') await updateDoc(doc(db, 'users', currentUser.id), { walletBalance: increment(-Number(data.fareJod)) });
            notifyRider('🎉 وصلت بالسلامة!', `الأجرة: ${Number(data.fareJod).toFixed(2)} د.أ`, 'status');
            lastCompletedRideId = activeRideId; resetRideWatchers();
            document.getElementById('rider-panel-active').classList.add('hidden');
            document.getElementById('rider-panel-rating').classList.remove('hidden');
            document.getElementById('rating-summary').innerText = `${Number(data.fareJod).toFixed(2)} د.أ (${data.paymentMethod})`;
          } else if (data.status === 'CANCELLED_NO_SHOW') {
            notifyRider('⚠️ تم إلغاء الرحلة', 'انتهت مهلة 5 دقائق وخصم 0.50 د.أ تعويضاً للكابتن', 'status');
            resetRiderUI();
          } else if (data.status === 'CANCELLED') resetRiderUI();
        }
      });
      listenChat(activeRideId);
    };

    window.cancelRideRider = async () => {
      if (!activeRideId) return;
      const movedKm = Number(activeRideData?.captainMovedKm || 0);
      const hasPenalty = activeRideData && (activeRideData.status === 'ARRIVED' || movedKm >= 2.0);
      if (hasPenalty) {
        if (!confirm('⚠️ الكابتن تحرك أكثر من 2 كم نحوك (أو وصل لموقعك).\nإلغاء الطلب الآن سيخصم 0.50 د.أ (50 قرشاً) تعويضاً للكابتن.\nهل تريد المتابعة؟')) return;
        await updateDoc(doc(db, 'rides', activeRideId), { status: 'CANCELLED', cancelFeeJod: 0.50, cancelledBy: 'RIDER' });
        await updateDoc(doc(db, 'users', currentUser.id), { walletBalance: increment(-0.50) });
        if (activeRideData.captainId) await updateDoc(doc(db, 'users', activeRideData.captainId), { walletBalance: increment(0.50) });
        alert('تم إلغاء الطلب وتحويل 0.50 د.أ تعويضاً للكابتن.');
      } else {
        await updateDoc(doc(db, 'rides', activeRideId), { status: 'CANCELLED', cancelFeeJod: 0, cancelledBy: 'RIDER' });
      }
      resetRiderUI();
    };

    function resetRideWatchers() {
      if (unsubRide) unsubRide(); if (unsubChat) unsubChat();
      if (waitInterval) clearInterval(waitInterval);
      if (capMarker && map) { map.removeLayer(capMarker); capMarker = null; }
    }
    function resetRiderUI() {
      resetRideWatchers(); activeRideId = null; activeRideData = null; lastRideStatus = null; dropoffCoords = null;
      if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; }
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      ['captain-info-box', 'rider-chat-box', 'rider-wait-timer', 'rider-cancel-warning', 'rider-panel-active', 'rider-panel-rating', 'rider-panel-book'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById('rider-panel-dest').classList.remove('hidden');
      if (pickupCoords) map.setView(pickupCoords, 15);
    }

    window.rateRide = async (stars) => {
      if (lastCompletedRideId) await updateDoc(doc(db, 'rides', lastCompletedRideId), { rating: stars });
      lastCompletedRideId = null; resetRiderUI();
    };
    window.shareRide = async () => {
      const t = `رحلتي مع NshmiBike 🇯🇴 رقم: ${activeRideId}`;
      if (navigator.share) { try { await navigator.share({ text: t }); } catch (e) {} } else alert(t);
    };
    window.triggerSOS = async () => {
      await addDoc(collection(db, 'sos_alerts'), { userId: currentUser?.id || 'guest', rideId: activeRideId || null, createdAt: serverTimestamp() });
      if (confirm('🚨 تم إرسال تنبيه SOS.\nهل تريد الاتصال بـ 911؟')) window.location.href = 'tel:911';
    };

    function listenChat(rideId) {
      if (unsubChat) unsubChat();
      let firstLoad = true;
      const q = query(collection(db, 'rides', rideId, 'messages'), orderBy('createdAt', 'asc'));
      unsubChat = onSnapshot(q, (snap) => {
        const box = document.getElementById('rider-messages'); box.innerHTML = '';
        snap.forEach((m) => {
          const d = m.data(), div = document.createElement('div');
          div.className = 'bg-white px-2 py-1 rounded-lg border border-slate-100';
          const s = document.createElement('span'); s.className = 'font-bold text-[#007A3D]'; s.textContent = d.senderName + ': ';
          const t = document.createElement('span'); t.textContent = d.text;
          div.appendChild(s); div.appendChild(t); box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
        if (!firstLoad) {
          snap.docChanges().forEach((c) => { if (c.type === 'added' && c.doc.data().role !== 'RIDER') notifyRider('💬 رسالة من الكابتن', c.doc.data().text, 'chat'); });
        }
        firstLoad = false;
      });
    }
    window.sendChat = async () => {
      if (!activeRideId) return;
      const inp = document.getElementById('rider-chat-input'), text = inp.value.trim();
      if (!text) return; inp.value = '';
      await addDoc(collection(db, 'rides', activeRideId, 'messages'), { senderName: currentUser.name, role: 'RIDER', text, createdAt: serverTimestamp() });
    };
  </script>
</body>
</html>
