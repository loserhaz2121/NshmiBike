<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#007A3D" />
  <link rel="icon" type="image/jpeg" href="logo-rider.jpg" />
  <link rel="apple-touch-icon" href="logo-rider.jpg" />
  <link rel="manifest" href="manifest.json" />
  <title>NshmiBike</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background: #0f172a; }
    #map { height: 100%; width: 100%; z-index: 1; }
    .jo-green { background-color: #007A3D; }
    .jo-text { color: #007A3D; }
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 34px) !important; }
    .shmagh-strip { height: 6px; background: repeating-linear-gradient(45deg, #CE1126, #CE1126 8px, #fff 8px, #fff 16px); }
    .gps-dot { width: 16px; height: 16px; background: #2563eb; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 8px rgba(37,99,235,0.25); }
  </style>
  <script>
    window.tryNextLogo = function(img) {
      const list = (img.dataset.fallbacks || '').split(',').filter(Boolean);
      const idx = Number(img.dataset.fIdx || 0);
      if (idx < list.length) { img.dataset.fIdx = idx + 1; img.src = list[idx]; }
      else { img.style.display = 'none'; }
    };
  </script>
</head>
<body class="min-h-screen flex justify-center bg-slate-900">

  <div id="toast-banner" class="hidden fixed top-3 left-1/2 -translate-x-1/2 z-[60] w-[92%] max-w-[400px] bg-slate-900 text-white p-3.5 rounded-2xl shadow-2xl border-r-4 border-[#CE1126]">
    <div id="toast-title" class="font-extrabold text-xs text-emerald-400"></div>
    <div id="toast-body" class="text-xs mt-0.5"></div>
  </div>

  <div class="w-full max-w-[440px] h-screen bg-white flex flex-col relative shadow-2xl overflow-hidden">

    <!-- 1. دخول وتسجيل العميل -->
    <div id="screen-login" class="flex-1 flex flex-col justify-center p-5 bg-gradient-to-b from-emerald-50 via-white to-red-50/40 relative overflow-y-auto safe-bottom">
      <div class="shmagh-strip absolute top-0 left-0 right-0"></div>
      <div class="flex justify-end mb-2"><button type="button" onclick="toggleLanguage()" class="bg-white border px-3 py-1 rounded-full text-xs font-extrabold shadow-sm">🌐 <span class="lang-switch-label">English</span></button></div>
      <div class="text-center mb-4">
        <div class="w-28 h-28 rounded-full bg-white mx-auto overflow-hidden shadow-xl mb-2 border-2 border-[#CE1126] p-0.5">
          <img src="logo-rider.jpg" data-fallbacks="logo-rider.JPG,logo-rider.jpeg,logo-rider.JPEG,logo-rider.png,logo-rider.PNG" onerror="tryNextLogo(this)" alt="NshmiBike" class="w-full h-full object-contain rounded-full">
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900">Nshmi<span class="text-[#CE1126]">Bike</span></h1>
        <p data-ar="للشباب والرجال (+18) فقط • عمّان • إربد • الزرقاء" data-en="Adult Males (18+) Only • Amman • Irbid • Zarqa" class="i18n text-[11px] text-slate-600 font-semibold mt-0.5">للشباب والرجال (+18) فقط • عمّان • إربد • الزرقاء</p>
      </div>

      <form onsubmit="event.preventDefault(); loginRider();" class="bg-white p-4 rounded-3xl shadow-lg border border-slate-100 space-y-2.5">
        <div class="grid grid-cols-2 gap-1.5 bg-slate-100 p-1 rounded-2xl text-xs font-extrabold">
          <button type="button" id="auth-tab-login" onclick="switchAuthMode('login')" data-ar="تسجيل الدخول" data-en="Sign In" class="i18n jo-green text-white py-2 rounded-xl">تسجيل الدخول</button>
          <button type="button" id="auth-tab-reg" onclick="switchAuthMode('register')" data-ar="عميل جديد" data-en="New Customer" class="i18n text-slate-600 py-2 rounded-xl">عميل جديد</button>
        </div>
        <div id="reg-fields" class="hidden space-y-2">
          <div><label data-ar="الاسم الكامل" data-en="Full Name" class="i18n block text-[11px] font-bold text-slate-700 mb-1">الاسم الكامل</label><input id="login-name" type="text" data-ar-ph="مثال: يزيد" data-en-ph="e.g. Yazeed" placeholder="مثال: يزيد" class="i18n-ph w-full border rounded-xl px-3 py-2 text-sm"></div>
          <div><label data-ar="رقم الهاتف الأردني" data-en="Jordanian Phone" class="i18n block text-[11px] font-bold text-slate-700 mb-1">رقم الهاتف الأردني</label><input id="login-phone" type="tel" placeholder="079xxxxxxx" class="w-full border rounded-xl px-3 py-2 text-sm text-left" dir="ltr"></div>
          <label class="flex items-start gap-2 text-[11px] font-bold text-[#CE1126] bg-red-50 p-2 rounded-xl cursor-pointer">
            <input id="reg-male-18" type="checkbox" class="accent-[#CE1126] w-4 h-4 mt-0.5 shrink-0">
            <span data-ar="أقر بأنني شاب/رجل بالغ (+18) — الخدمة غير متاحة للنساء أو الأطفال" data-en="I confirm I am an adult male (18+) — Not for women or children" class="i18n">أقر بأنني شاب/رجل بالغ (+18) — الخدمة غير متاحة للنساء أو الأطفال</span>
          </label>
        </div>
        <div><label data-ar="البريد الإلكتروني" data-en="Email Address" class="i18n block text-[11px] font-bold text-slate-700 mb-1">البريد الإلكتروني</label><input id="login-email" type="email" autocomplete="username" placeholder="customer@gmail.com" class="w-full border rounded-xl px-3 py-2 text-sm text-left" dir="ltr"></div>
        <div><label data-ar="كلمة المرور (6 أحرف فأكثر)" data-en="Password (6+ chars)" class="i18n block text-[11px] font-bold text-slate-700 mb-1">كلمة المرور (6 أحرف فأكثر)</label><input id="login-pass" type="password" autocomplete="current-password" placeholder="******" class="w-full border rounded-xl px-3 py-2 text-sm text-left" dir="ltr"></div>
        <div class="flex items-center justify-between text-xs pt-1">
          <label class="flex items-center gap-1.5 font-bold text-slate-700 cursor-pointer"><input id="remember-me" type="checkbox" checked class="accent-[#007A3D] w-4 h-4"><span data-ar="تذكرني عند الدخول" data-en="Remember me" class="i18n">تذكرني عند الدخول</span></label>
          <button type="button" onclick="resetPassword()" data-ar="نسيت كلمة المرور؟" data-en="Forgot password?" class="i18n text-[#CE1126] font-bold underline text-[11px]">نسيت كلمة المرور؟</button>
        </div>
        <button type="submit" id="btn-login" class="w-full jo-green text-white font-extrabold py-3 rounded-2xl shadow-lg text-sm">دخول العميل 🔔</button>
        <p id="login-error" class="text-xs text-red-600 font-bold text-center hidden"></p>
      </form>
    </div>

    <!-- 2. شاشة العميل الرئيسية -->
    <div id="screen-rider" class="hidden flex-1 flex flex-col h-full relative">
      <div class="shmagh-strip shrink-0"></div>
      <header class="p-2.5 bg-white shadow-sm flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <button onclick="toggleDrawer(true)" class="w-9 h-9 bg-slate-100 rounded-xl flex items-center justify-center text-lg font-bold shrink-0">☰</button>
          <img src="logo-rider.jpg" data-fallbacks="logo-rider.JPG,logo-rider.jpeg,logo-rider.JPEG,logo-rider.png,logo-rider.PNG" onerror="tryNextLogo(this)" alt="NshmiBike" class="w-11 h-11 rounded-full bg-white object-contain border border-[#CE1126] shadow-sm shrink-0">
          <div class="min-w-0">
            <div class="font-extrabold text-slate-900 text-sm leading-tight">Nshmi<span class="text-[#CE1126]">Bike</span></div>
            <div id="city-badge" class="text-[10px] jo-text font-extrabold truncate">📍 ...</div>
          </div>
        </div>
        <div class="flex gap-1.5 shrink-0">
          <button onclick="toggleLanguage()" class="bg-slate-100 text-slate-700 text-[11px] font-extrabold px-2.5 py-1 rounded-full lang-switch-label">EN</button>
          <button onclick="openModal('inbox')" class="bg-emerald-50 text-[#007A3D] text-[11px] font-bold px-2 py-1 rounded-full">📬</button>
          <button onclick="triggerSOS()" class="bg-[#CE1126] text-white text-[11px] font-bold px-2.5 py-1 rounded-full">🆘 SOS</button>
        </div>
      </header>

      <div class="relative flex-1 bg-slate-100">
        <div id="map"></div>
        <div id="center-pin-overlay" class="hidden pointer-events-none absolute inset-0 z-10 flex flex-col items-center justify-center">
          <div data-ar="حرّك الخريطة لتحديد نقطة الانطلاق" data-en="Move map to set pickup" class="i18n bg-slate-900 text-white text-[10px] font-bold px-2.5 py-1 rounded-full mb-1 shadow">حرّك الخريطة لتحديد نقطة الانطلاق</div>
          <div class="text-3xl -mt-1">📍</div>
        </div>
        <div id="weather-surge-bar" class="hidden absolute top-14 left-3 right-3 z-10 bg-amber-100/95 text-amber-900 text-[11px] font-extrabold text-center py-1 px-3 rounded-full shadow"></div>
        <div id="nearby-caps-pill" class="hidden absolute bottom-2.5 left-3 z-10 bg-slate-900/90 text-white px-2.5 py-1 rounded-full text-[10px] font-extrabold shadow"></div>
        <div class="absolute top-3 left-3 right-3 z-10 flex justify-between items-center pointer-events-none">
          <select id="city-filter" onchange="switchCity(this.value)" class="pointer-events-auto bg-white/95 backdrop-blur px-3 py-1.5 rounded-full shadow-md text-xs font-extrabold border">
            <option value="amman">🏙️ عمّان / Amman</option><option value="irbid">🏙️ إربد / Irbid</option><option value="zarqa">🏙️ الزرقاء / Zarqa</option>
          </select>
          <button onclick="useMyGPS()" data-ar="🎯 موقعي GPS" data-en="🎯 My GPS" class="i18n pointer-events-auto bg-white/95 backdrop-blur px-3 py-1.5 rounded-full shadow-md text-xs font-extrabold text-blue-600 border">🎯 موقعي GPS</button>
        </div>
      </div>

      <div id="rider-panel-pin" class="hidden bg-white rounded-t-3xl shadow-2xl px-4 pt-4 safe-bottom z-20 space-y-2.5 shrink-0">
        <div data-ar="ضع الدبوس على نقطة انطلاقك ثم اضغط تثبيت" data-en="Place pin on pickup point then confirm" class="i18n text-xs font-extrabold text-slate-800 text-center">ضع الدبوس على نقطة انطلاقك ثم اضغط تثبيت</div>
        <div class="flex gap-2">
          <button onclick="cancelPinEdit()" data-ar="↩ رجوع" data-en="↩ Back" class="i18n w-24 bg-slate-100 text-slate-700 font-bold py-3 rounded-2xl text-xs">↩ رجوع</button>
          <button onclick="confirmPinPickup()" data-ar="✓ تثبيت نقطة الانطلاق" data-en="✓ Confirm Pickup" class="i18n flex-1 jo-green text-white font-extrabold py-3 rounded-2xl text-sm">✓ تثبيت نقطة الانطلاق</button>
        </div>
      </div>

      <div id="rider-panel-dest" class="bg-white rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.12)] px-4 pt-3 safe-bottom z-20 shrink-0 space-y-2">
        <div id="debt-notice" class="hidden bg-red-50 text-[#CE1126] text-[10px] font-extrabold text-center py-1 rounded-lg"></div>
        <div class="flex items-center justify-between gap-2 text-xs font-bold text-slate-600 bg-blue-50/70 px-3 py-2 rounded-xl">
          <div class="flex items-center gap-2 truncate"><span class="w-2.5 h-2.5 rounded-full bg-blue-600 shrink-0"></span><span id="pickup-label" class="truncate">GPS...</span></div>
          <button onclick="startPinEdit()" data-ar="✏️ تحريك الدبوس" data-en="✏️ Move Pin" class="i18n text-[10px] bg-white px-2 py-1 rounded-lg shadow-sm font-extrabold text-blue-700 shrink-0">✏️ تحريك الدبوس</button>
        </div>
        <div class="flex gap-1.5">
          <input id="dest-search" type="text" oninput="debouncedSearch()" onkeydown="if(event.key==='Enter') searchPlace()" data-ar-ph="🔍 ابحث عن معلم أو شارع (أو اضغط الخريطة)" data-en-ph="🔍 Search landmark or street (or tap map)" placeholder="🔍 ابحث عن معلم أو شارع (أو اضغط الخريطة)" class="i18n-ph flex-1 bg-slate-100 rounded-2xl px-3.5 py-2 text-xs font-bold">
          <button onclick="searchPlace()" data-ar="بحث" data-en="Search" class="i18n jo-green text-white px-4 rounded-2xl text-xs font-extrabold">بحث</button>
        </div>
        <div id="search-results" class="hidden max-h-36 overflow-y-auto space-y-1 bg-slate-50 p-2 rounded-2xl border"></div>
        <div id="saved-places-bar" class="grid grid-cols-3 gap-1.5"></div>
        <div id="quick-places" class="flex gap-1.5 overflow-x-auto pb-1"></div>
      </div>

      <div id="rider-panel-book" class="hidden bg-white rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.14)] px-4 pt-3 safe-bottom z-20 shrink-0">
        <div class="flex items-center justify-between gap-1 mb-1.5">
          <div class="text-xs font-extrabold text-slate-800 truncate flex-1"><span data-ar="📍 إلى:" data-en="📍 To:" class="i18n">📍 إلى:</span> <span id="chosen-dest-label" class="jo-text"></span></div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="saveCurrentPlace('home')" title="حفظ كبيت" class="bg-slate-100 px-1.5 py-1 rounded-lg text-[10px] font-bold">⭐🏠</button>
            <button onclick="saveCurrentPlace('work')" title="حفظ كعمل" class="bg-slate-100 px-1.5 py-1 rounded-lg text-[10px] font-bold">⭐💼</button>
            <button onclick="saveCurrentPlace('uni')" title="حفظ كجامعة" class="bg-slate-100 px-1.5 py-1 rounded-lg text-[10px] font-bold">⭐🎓</button>
            <button onclick="backToDestStep()" data-ar="↩ رجوع" data-en="↩ Back" class="i18n text-[11px] bg-slate-200 px-2.5 py-1 rounded-full font-extrabold text-slate-800">↩ رجوع</button>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-1.5 mb-1.5">
          <button onclick="selectTier('SCOOTER')" id="tier-SCOOTER" class="tier-btn border-2 border-[#007A3D] bg-emerald-50 rounded-xl p-1.5 text-center"><div class="text-base">🛵</div><div data-ar="نشمي سكوتر" data-en="Nshmi Scooter" class="i18n text-[10px] font-extrabold">نشمي سكوتر</div><div id="price-SCOOTER" class="text-xs font-extrabold jo-text">0.60</div></button>
          <button onclick="selectTier('BIKE')" id="tier-BIKE" class="tier-btn border border-slate-200 bg-white rounded-xl p-1.5 text-center"><div class="text-base">🏍️</div><div data-ar="نشمي بايك" data-en="Nshmi Bike" class="i18n text-[10px] font-extrabold">نشمي بايك</div><div id="price-BIKE" class="text-xs font-extrabold text-slate-700">0.75</div></button>
          <button onclick="selectTier('EXPRESS')" id="tier-EXPRESS" class="tier-btn border border-slate-200 bg-white rounded-xl p-1.5 text-center"><div class="text-base">📦</div><div data-ar="طرود سريعة" data-en="Express Parcel" class="i18n text-[10px] font-extrabold">طرود سريعة</div><div id="price-EXPRESS" class="text-xs font-extrabold text-slate-700">0.70</div></button>
        </div>
        <div id="express-box" class="hidden mb-1.5"><input id="express-recipient" type="tel" data-ar-ph="📦 رقم هاتف مستلم الطرد (079xxxxxxx)" data-en-ph="📦 Recipient phone (079xxxxxxx)" placeholder="📦 رقم هاتف مستلم الطرد (079xxxxxxx)" class="i18n-ph w-full bg-blue-50 border border-blue-200 rounded-xl px-3 py-1.5 text-xs font-bold"></div>
        <div id="car-savings-badge" class="bg-emerald-50 text-[#007A3D] text-[10px] font-bold text-center py-1 rounded-lg mb-1.5"></div>
        <div id="book-debt-line" class="hidden bg-red-50 text-[#CE1126] text-[10px] font-extrabold text-center py-1 rounded-lg mb-1.5"></div>
        <div class="flex gap-1.5 mb-1.5">
          <input id="promo-input" type="text" data-ar-ph="كود الخصم" data-en-ph="Promo Code" placeholder="كود الخصم" class="i18n-ph flex-1 bg-slate-50 border rounded-xl px-2.5 py-1 text-xs uppercase font-bold">
          <button onclick="applyPromo()" data-ar="تطبيق" data-en="Apply" class="i18n bg-slate-900 text-white px-3 rounded-xl text-xs font-bold">تطبيق</button>
        </div>
        <div class="flex items-center justify-between text-[11px] mb-1.5 gap-1">
          <select id="ride-when" onchange="toggleScheduleInput()" class="bg-slate-100 px-2 py-1 rounded-lg font-bold text-slate-700">
            <option value="now" data-ar="⚡ الآن" data-en="⚡ Now" class="i18n">⚡ الآن</option>
            <option value="later" data-ar="📅 حجز مجدول" data-en="📅 Schedule" class="i18n">📅 حجز مجدول</option>
          </select>
          <input id="schedule-time" type="datetime-local" class="hidden flex-1 bg-slate-100 px-2 py-1 rounded-lg text-[10px] font-bold">
          <select id="payment-method" class="bg-slate-100 px-2 py-1 rounded-lg font-bold text-slate-700">
            <option value="كاش" data-ar="💵 كاش" data-en="💵 Cash" class="i18n">💵 كاش</option>
            <option value="محفظة نشمي" data-ar="👛 المحفظة" data-en="👛 Wallet" class="i18n">👛 المحفظة</option>
          </select>
        </div>
        <label class="flex items-center justify-between text-[10px] font-bold text-[#CE1126] bg-red-50 px-2.5 py-1 rounded-lg mb-2 cursor-pointer">
          <span><input id="ride-male-only" type="checkbox" checked class="accent-[#CE1126] ml-1"><span data-ar=" أؤكد أن الراكب شاب/رجل (+18) — ممنوع للنساء والأطفال" data-en=" Adult male passenger (18+) only" class="i18n"> أؤكد أن الراكب شاب/رجل (+18) — ممنوع للنساء والأطفال</span></span>
          <span data-ar="🪖 خوذة" data-en="🪖 Helmet" class="i18n">🪖 خوذة</span>
        </label>
        <button onclick="requestRide()" id="btn-request-ride" data-ar="اطلب NshmiBike الآن" data-en="Request NshmiBike Now" class="i18n w-full jo-green text-white font-extrabold py-3 rounded-2xl shadow-lg text-sm">اطلب NshmiBike الآن</button>
      </div>

      <div id="rider-panel-active" class="hidden bg-white rounded-t-3xl shadow-2xl px-4 pt-3 safe-bottom z-20 space-y-2 shrink-0">
        <div class="flex justify-between items-center">
          <span id="rider-ride-status" class="bg-amber-100 text-amber-800 text-xs font-extrabold px-3 py-1 rounded-full">...</span>
          <span id="rider-ride-fare" class="font-extrabold text-slate-800 text-xs"></span>
        </div>
        <div id="rider-pin-box" class="hidden bg-slate-900 text-white text-xs font-extrabold text-center py-1.5 rounded-xl tracking-wider">
          <span data-ar="🔐 كود بدء الرحلة (أعطه للكابتن):" data-en="🔐 Start Ride PIN:" class="i18n">🔐 كود بدء الرحلة (أعطه للكابتن):</span> <span id="rider-pin-val" class="text-emerald-400 text-sm">----</span>
        </div>
        <div id="rider-arrival-timer" class="hidden bg-blue-50 text-blue-800 text-[11px] font-bold text-center py-1 rounded-xl"></div>
        <div id="rider-wait-timer" class="hidden bg-red-50 text-[#CE1126] text-xs font-extrabold text-center py-1.5 rounded-xl"></div>
        <div id="rider-cancel-warning" class="hidden bg-amber-50 text-amber-900 text-[11px] font-bold text-center py-1 rounded-lg"></div>
        <div id="captain-info-box" class="hidden bg-slate-50 p-2.5 rounded-2xl border flex justify-between items-center">
          <div><div id="cap-info-name" class="font-extrabold text-sm text-slate-800"></div><div id="cap-info-bike" class="text-xs text-slate-500"></div></div>
          <div class="flex gap-1.5">
            <button onclick="changeDropoffActive()" class="bg-white border px-2 py-1.5 rounded-xl text-[11px] font-bold">📍+1</button>
            <button onclick="shareRide()" class="bg-white border px-2 py-1.5 rounded-xl text-xs font-bold">🔗</button>
            <a id="cap-call-link" href="#" class="jo-green text-white px-2.5 py-1.5 rounded-xl text-xs font-bold">📞</a>
          </div>
        </div>
        <div id="rider-chat-box" class="hidden border rounded-2xl p-2 bg-slate-50 space-y-1">
          <div id="rider-quick-replies" class="flex gap-1 overflow-x-auto pb-0.5"></div>
          <div id="rider-messages" class="max-h-20 overflow-y-auto text-xs space-y-1"></div>
          <div class="flex gap-1"><input id="rider-chat-input" type="text" onkeydown="if(event.key==='Enter') sendChat()" data-ar-ph="راسل الكابتن..." data-en-ph="Message captain..." placeholder="راسل الكابتن..." class="i18n-ph flex-1 bg-white border rounded-xl px-2.5 py-1.5 text-xs"><button onclick="sendChat()" data-ar="إرسال" data-en="Send" class="i18n jo-green text-white px-3 rounded-xl text-xs font-bold">إرسال</button></div>
        </div>

      origFares.SCOOTER = calcTierOrigFare('SCOOTER', currentDistKm); origFares.BIKE = calcTierOrigFare('BIKE', currentDistKm); origFares.EXPRESS = calcTierOrigFare('EXPRESS', currentDistKm);

    function startArrivalCountdown(deadlineMs, hasPenalty) {
      const key = `${deadlineMs}_${hasPenalty}`;

      const el = document.getElementById('rider-arrival-timer'); if (!deadlineMs) { el.classList.add('hidden'); return; }

        const left = Math.max(0, Math.floor((deadlineMs - Date.now()) / 1000));
        const dKm = (activeRideData?.captainLat && activeRideData?.pickupLat) ? (haversine([activeRideData.captainLat, activeRideData.captainLng], [activeRideData.pickupLat, activeRideData.pickupLng]) * 1.25).toFixed(1) : null;
        if (left > 0 && !hasPenalty) {
          el.className = 'bg-blue-50 text-blue-800 text-[11px] font-bold text-center py-1 rounded-xl';

          el.innerText = `${t('⏱️ وقت الوصول:', '⏱️ ETA:')} ${h > 0 ? String(h).padStart(2,'0') + ':' : ''}${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}${dKm ? ` • ${dKm} ${t('كم','km')}` : ''}`;

      tick(); arrivalInterval = setInterval(tick, 1000);
    }

    function startWaitCountdown(d) {
      const key = `${d.arrivedAtMs}_${d.waitPaused}_${d.totalPausedMs}_${d.pauseStartedMs}`;
      if (key === lastRiderWaitKey && waitInterval) return;

        const left = Math.max(0, 300 - Math.floor((Date.now() - aMs - pMs) / 1000));
        el.innerText = left > 0 ? `⏱️ ${t('الكابتن بانتظارك:', 'Captain waiting:')} ${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}` : t('⚠️ انتهى الانتظار المجاني', '⚠️ Free wait ended');
      };

    async function buildFastDispatchQueue(cityAr, excludeIds = [], refCoords = pickupCoords) {
      try {
        const snap = await getDocs(query(collection(db, 'captains'), where('isOnline', '==', true))), cand = [], favs = currentUser.favoriteCaptains || [], now = Date.now();
        snap.forEach(d => {
          const u = d.data(), recentlySeen = now - Number(u.lastSeenMs || 0) <= 90000;
          if (recentlySeen && !excludeIds.includes(d.id) && !u.isBlocked && u.isApproved === true && Number(u.walletBalance || 0) > -2.0 && (!u.city || u.city === cityAr)) {
            const dk = (u.lat && u.lng) ? haversine(refCoords, [u.lat, u.lng]) : 4.0;
            if (dk <= 8.0) cand.push({ id: d.id, score: Math.max(0, (8.0 - dk) / 8.0) * 60 + (Number(u.acceptRate ?? 100) / 100) * 20 + (Number(u.avgStars ?? 5.0) / 5.0) * 20 + (favs.includes(d.id) ? 15 : 0) });
          }
        });
        cand.sort((a, b) => b.score - a.score); return cand.slice(0, 5).map(c => c.id);
      } catch (e) { return []; }
    }

    function startDispatchLoop(queueIds, startIndex = 0) {

        else { await updateDoc(doc(db, 'rides', activeRideId), { targetCaptainId: 'ALL' }).catch(() => {}); clearInterval(dispatchInterval); dispatchInterval = null; }
      }, 7000);
    }

        if (data.status === 'SEARCHING') badge.innerText = data.targetCaptainId === 'ALL' ? t(`جاري العرض لكباتن ${data.city||''}... 🛵`, `Searching captains... 🛵`) : t(`موجه لأقرب كابتن (${(data.dispatchIndex||0)+1})... 🛵`, `Dispatching (${(data.dispatchIndex||0)+1})... 🛵`);
        else if (data.status === 'SCHEDULED') badge.innerText = `📅 ${t('بانتظار كابتن لموعد:','Scheduled for:')} ${data.scheduledFor}`;
        else if (data.status === 'SCHEDULED_ACCEPTED') badge.innerText = `📅 ${t('تم حجز الكابتن لموعد:','Captain booked for:')} ${data.scheduledFor}`;

        if (data.status !== lastRideStatus) {
          const prev = lastRideStatus; lastRideStatus = data.status;

          if (data.status === 'SEARCHING' && ['ACCEPTED', 'ARRIVED'].includes(prev)) {
            didFitCapToPickup = false;
            document.getElementById('captain-info-box').classList.add('hidden'); document.getElementById('rider-chat-box').classList.add('hidden');
            if (capMarker && map) { map.removeLayer(capMarker); capMarker = null; } if (capRouteLine && map) { map.removeLayer(capRouteLine); capRouteLine = null; }
            notifyRider(t('🔄 اعتذر الكابتن', '🔄 Captain Reassigned'), t('جاري البحث فوراً عن كابتن آخر قريب!', 'Finding another nearby captain now!'), 'status');
            const newQ = await buildFastDispatchQueue(data.city || CITIES[currentCity].nameAr, data.declinedCaptainIds || [], [data.pickupLat, data.pickupLng]);
            if (newQ.length > 0) { await updateDoc(doc(db, 'rides', activeRideId), { dispatchQueue: newQ, dispatchIndex: 0, targetCaptainId: newQ[0] }).catch(() => {}); startDispatchLoop(newQ, 0); }
          }
          if (data.status === 'SCHEDULED' && prev === 'SCHEDULED_ACCEPTED') {
            document.getElementById('captain-info-box').classList.add('hidden'); document.getElementById('rider-chat-box').classList.add('hidden');
            notifyRider(t('🔄 اعتذر الكابتن عن الموعد', '🔄 Captain Released Slot'), t('تم إعادة فتح الحجز لباقي الكباتن', 'Reopened for other captains'), 'status');
          }

          if (data.status !== 'SEARCHING' && dispatchInterval) { clearInterval(dispatchInterval); dispatchInterval = null; }
          if (['SCHEDULED_ACCEPTED', 'ACCEPTED', 'ARRIVED', 'ON_TRIP'].includes(data.status)) {
            document.getElementById('captain-info-box').classList.remove('hidden'); document.getElementById('rider-chat-box').classList.remove('hidden');
            document.getElementById('cap-info-name').innerText = `${t('الكابتن', 'Captain')} ${data.captainName}`;
            document.getElementById('cap-info-bike').innerText = `${data.bikeModel} • ${data.plate}`;
            document.getElementById('cap-call-link').href = `tel:${data.captainPhone}`;
          }
          if (data.status === 'SCHEDULED_ACCEPTED' && prev !== null) notifyRider(t('📅 تم تأكيد الكابتن لموعدك!', '📅 Captain Confirmed Slot!'), `${data.captainName} (${data.scheduledFor})`, 'status');
          if (data.status === 'ACCEPTED') { badge.innerText = t('الكابتن في طريقه إليك!', 'Captain on the way!'); if (prev !== null) notifyRider(t('🛵 الكابتن في طريقه إليك!', '🛵 Captain On The Way!'), `${data.captainName}`, 'status'); }
          else if (data.status === 'ARRIVED') { badge.innerText = t('الكابتن وصل لموقعك 📍', 'Captain Arrived 📍'); if (prev !== null) notifyRider(t('📍 الكابتن وصل!', '📍 Arrived!'), `PIN: ${data.ridePin}`, 'status'); }
          else if (data.status === 'ON_TRIP') { badge.innerText = t('الرحلة جارية 💨', 'Trip In Progress 💨'); document.getElementById('rider-pin-box').classList.add('hidden'); if (prev !== null) notifyRider(t('💨 انطلقت الرحلة', '💨 Trip Started'), 'NshmiBike', 'status'); }
          else if (data.status === 'COMPLETED') {
            appliedPromo = null; document.getElementById('promo-input').value = '';
            const fid = activeRideId, capId = data.captainId; resetRideWatchers(); activeRideId = null; lastCompletedRideId = fid; lastCompletedCapId = capId;
            selectStars(5); document.getElementById('rating-comment').value = ''; document.getElementById('fav-captain-chk').checked = false;
            notifyRider(t('🎉 وصلت بالسلامة!', '🎉 Arrived Safely!'), `${Number(data.fareJod||0).toFixed(2)} ${t('د.أ','JOD')}`, 'status');
            document.getElementById('rider-panel-active').classList.add('hidden'); document.getElementById('rider-panel-rating').classList.remove('hidden');
            document.getElementById('rating-summary').innerText = `${data.captainName} • ${Number(data.fareJod||0).toFixed(2)} ${t('د.أ','JOD')}`;
          } else if (data.status === 'CANCELLED_NO_SHOW') { notifyRider(t('⚠️ تم الإلغاء', '⚠️ Cancelled'), t('انتهت مهلة 5 دقائق', '5-min wait expired'), 'status'); resetRiderUI(); }
          else if (data.status === 'CANCELLED') { if (data.cancelledBy === 'ADMIN') notifyRider(t('🛑 أُلغيت الرحلة إدارياً', '🛑 Ride Cancelled by Admin'), '', 'status'); resetRiderUI(); }
        }
      });
      listenChat(activeRideId);
    }

    window.changeDropoffActive = () => { editingActiveDropoff = true; notifyRider(t('📍 تعديل الوجهة', '📍 Edit Dropoff'), t('اضغط على المكان الجديد في الخريطة!', 'Tap new location on map!'), 'chat'); };

    window.requestRide = async () => {
      unlockAudio();
      if (!document.getElementById('ride-male-only').checked) return alert(t('الخدمة للشباب والرجال (+18) فقط.', 'Adult males (18+) only.'));
      if (!dropoffCoords) return alert(t('اختر وجهتك أولاً', 'Pick destination first'));
      const expPhone = normJoPhone(document.getElementById('express-recipient').value);
      if (selectedTier === 'EXPRESS' && expPhone.length < 10) return alert(t('أدخل هاتف مستلم الطرد (07xxxxxxxx)', 'Enter recipient phone (07xxxxxxxx)'));
      const isLater = document.getElementById('ride-when').value === 'later', schedVal = document.getElementById('schedule-time').value;
      if (isLater && !schedVal) return alert(t('حدد وقت الحجز', 'Pick schedule time'));
      const payMethod = document.getElementById('payment-method').value, debt = currentUser.walletBalance < 0 ? +Math.abs(currentUser.walletBalance).toFixed(2) : 0;
      const origFare = origFares[selectedTier], finalFare = +(fares[selectedTier] + debt).toFixed(2), discAmount = +(origFare - fares[selectedTier]).toFixed(2);
      if (payMethod === 'محفظة نشمي' && currentUser.walletBalance < finalFare) return alert(t('رصيد المحفظة غير كافٍ — اشحن عبر CliQ من القائمة', 'Insufficient wallet — top-up via CliQ'));

      const btn = document.getElementById('btn-request-ride'); btn.innerText = t('جاري الطلب...', 'Requesting...'); btn.disabled = true;
      const cityAr = CITIES[currentCity].nameAr, queueIds = isLater ? [] : await buildFastDispatchQueue(cityAr);
      const ridePin = String(Math.floor(1000 + Math.random() * 9000));

      const newRide = {
        riderId: currentUser.id, riderName: currentUser.name, riderPhone: currentUser.phone, city: cityAr, tier: selectedTier,
        originalFareJod: origFare, fareJod: finalFare, discountJod: discAmount, settledDebtJod: debt, ridePin,
        promoCode: appliedPromo ? appliedPromo.code : null, promoDiscountPct: appliedPromo ? appliedPromo.discountPct : 0,
        promoMaxDiscountJod: appliedPromo ? appliedPromo.maxDiscountJod : 0, companyPaysPromo: appliedPromo ? appliedPromo.companyPays : false,
        expressRecipient: selectedTier === 'EXPRESS' ? expPhone : null, scheduledFor: isLater ? schedVal.replace('T', ' ') : null,
        distanceKm: Number(currentDistKm.toFixed(1)), pickupAddress, dropoffAddress,
        pickupLat: pickupCoords[0], pickupLng: pickupCoords[1], dropoffLat: dropoffCoords[0], dropoffLng: dropoffCoords[1],
        paymentMethod: payMethod, extraHelmet: true, dispatchQueue: queueIds, dispatchIndex: 0,
        targetCaptainId: isLater ? 'ALL' : (queueIds[0] || 'ALL'), declinedCaptainIds: [], captainMovedKm: 0, financialSettled: false,
        status: isLater ? 'SCHEDULED' : 'SEARCHING', createdAt: serverTimestamp()
      };
      const rideDoc = await addDoc(collection(db, 'rides'), newRide);
      btn.disabled = false; applyLanguage();
      attachToRide(rideDoc.id, newRide);
    };

    window.cancelRideRider = async () => {
      if (!activeRideId || activeRideData?.status === 'ON_TRIP') return;
      const mKm = Number(activeRideData?.captainMovedKm || 0), isLate = activeRideData?.arrivalDeadlineMs && Date.now() > activeRideData.arrivalDeadlineMs;
      const hasPenalty = activeRideData && ['ACCEPTED', 'ARRIVED'].includes(activeRideData.status) && !(activeRideData.captainPenaltyApplied || activeRideData.waitPaused || isLate) && (activeRideData.status === 'ARRIVED' || mKm >= 2.0);
      if (hasPenalty && !confirm(t('⚠️ الإلغاء يخصم 0.50 د.أ تعويضاً للكابتن. متابعة؟', '⚠️ Cancel fee is 0.50 JOD. Continue?'))) return;
      const btn = document.getElementById('btn-rider-cancel'); btn.disabled = true; const rRef = doc(db, 'rides', activeRideId);
      try {
        await runTransaction(db, async (tx) => {
          const rs = await tx.get(rRef); if (!rs.exists()) return;
          const rd = rs.data(); if (!['SEARCHING', 'SCHEDULED', 'SCHEDULED_ACCEPTED', 'ACCEPTED', 'ARRIVED'].includes(rd.status) || rd.financialSettled) return;
          const uSnap = await tx.get(doc(db, 'riders', currentUser.id));
          let cSnap = null; if (rd.captainId) cSnap = await tx.get(doc(db, 'captains', rd.captainId));
          const late = rd.arrivalDeadlineMs && Date.now() > rd.arrivalDeadlineMs;
          const pen = ['ACCEPTED', 'ARRIVED'].includes(rd.status) && !(rd.captainPenaltyApplied || rd.waitPaused || late) && (rd.status === 'ARRIVED' || Number(rd.captainMovedKm || 0) >= 2.0);
          if (pen) {
            tx.update(doc(db, 'riders', currentUser.id), { walletBalance: +(Number(uSnap.data()?.walletBalance || 0) - 0.50).toFixed(2) });
            if (cSnap && cSnap.exists()) tx.update(doc(db, 'captains', rd.captainId), { walletBalance: +(Number(cSnap.data()?.walletBalance || 0) + 0.50).toFixed(2) });
            tx.update(rRef, { status: 'CANCELLED', cancelFeeJod: 0.50, cancelledBy: 'RIDER', financialSettled: true });
          } else tx.update(rRef, { status: 'CANCELLED', cancelFeeJod: 0, cancelledBy: 'RIDER', financialSettled: true });
        });
      } finally { btn.disabled = false; resetRiderUI(); }
    };

    function resetRideWatchers() {
      keepAwake(false); editingActiveDropoff = false; didFitCapToPickup = false; lastRiderArrKey = ''; lastRiderWaitKey = '';
      if (unsubRide) { unsubRide(); unsubRide = null; } if (unsubChat) { unsubChat(); unsubChat = null; }
      if (waitInterval) { clearInterval(waitInterval); waitInterval = null; } if (arrivalInterval) { clearInterval(arrivalInterval); arrivalInterval = null; }
      if (dispatchInterval) { clearInterval(dispatchInterval); dispatchInterval = null; }
      if (capMarker && map) { map.removeLayer(capMarker); capMarker = null; } if (capRouteLine && map) { map.removeLayer(capRouteLine); capRouteLine = null; }
    }
    function resetRiderUI() {
      resetRideWatchers(); activeRideId = null; activeRideData = null; lastRideStatus = null; dropoffCoords = null;
      if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; } if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      ['captain-info-box', 'rider-chat-box', 'rider-pin-box', 'rider-wait-timer', 'rider-arrival-timer', 'rider-cancel-warning', 'rider-panel-active', 'rider-panel-rating', 'rider-panel-book'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById('rider-panel-dest').classList.remove('hidden'); if (pickupCoords) map.setView(pickupCoords, 15);
      renderNearbyCaptains();
    }

    window.selectStars = (n) => { chosenStars = n; for (let i = 1; i <= 5; i++) document.getElementById('star-' + i).className = i <= n ? 'scale-110 transition' : 'opacity-30 transition'; };
    window.submitRating = async () => {
      if (lastCompletedRideId) await updateDoc(doc(db, 'rides', lastCompletedRideId), { rating: chosenStars, ratingComment: document.getElementById('rating-comment').value.trim() || null });
      if (document.getElementById('fav-captain-chk').checked && lastCompletedCapId) await updateDoc(doc(db, 'riders', currentUser.id), { favoriteCaptains: arrayUnion(lastCompletedCapId) });
      lastCompletedRideId = null; lastCompletedCapId = null; resetRiderUI();
    };
    window.skipRating = () => { lastCompletedRideId = null; lastCompletedCapId = null; resetRiderUI(); };
    window.shareRide = async () => { const link = `https://loserhaz2121.github.io/NshmiBike/track.html?ride=${activeRideId}`; if (navigator.share) { try { await navigator.share({ title: 'NshmiBike', text: link, url: link }); } catch (e) {} } else alert(link); };

    window.triggerSOS = async () => {
      let lat = pickupCoords?.[0] || null, lng = pickupCoords?.[1] || null;
      if (navigator.geolocation) {
        try { const p = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 3000 })); lat = p.coords.latitude; lng = p.coords.longitude; } catch (e) {}
      }
      await addDoc(collection(db, 'sos_alerts'), { userId: currentUser?.id || 'guest', userName: currentUser?.name || 'عميل', phone: currentUser?.phone || currentUser?.id || '', rideId: activeRideId || null, lat, lng, resolved: false, createdAt: serverTimestamp() });
      if (confirm('🚨 SOS -> 911?')) window.location.href = 'tel:911';
    };

    function listenChat(rideId) {
      if (unsubChat) unsubChat(); let first = true;
      unsubChat = onSnapshot(query(collection(db, 'rides', rideId, 'messages'), orderBy('createdAt', 'asc')), (snap) => {
        const box = document.getElementById('rider-messages'); box.innerHTML = '';
        snap.forEach((m) => { const d = m.data(), div = document.createElement('div'); div.className = 'bg-white px-2 py-1 rounded-lg border'; const s = document.createElement('span'); s.className = 'font-bold text-[#007A3D]'; s.textContent = d.senderName + ': '; const tx = document.createElement('span'); tx.textContent = d.text; div.appendChild(s); div.appendChild(tx); box.appendChild(div); });
        box.scrollTop = box.scrollHeight;
        if (!first) snap.docChanges().forEach((c) => { if (c.type === 'added' && c.doc.data().role !== 'RIDER') notifyRider(t('💬 رسالة من الكابتن', '💬 Message from Captain'), c.doc.data().text, 'chat'); });
        first = false;
      });
    }
    window.sendChat = async (presetText) => {
      if (!activeRideId) return;
      const i = document.getElementById('rider-chat-input');
      const tx = typeof presetText === 'string' ? presetText : i.value.trim();
      if (!tx) return;
      if (typeof presetText !== 'string') i.value = '';
      await addDoc(collection(db, 'rides', activeRideId, 'messages'), { senderName: currentUser.name, role: 'RIDER', text: tx, createdAt: serverTimestamp() });
    };
  </script>
</body>
</html>
