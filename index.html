<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#00B14F" />
  <link rel="manifest" href="manifest.json" />
  <title>NshmiBike - تطبيق الركاب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>

<body class="min-h-screen flex justify-center bg-slate-900">

  <!-- إشعار منبثق داخل التطبيق -->
  <div id="toast-banner" class="hidden fixed top-3 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-[400px] bg-slate-900 text-white p-3.5 rounded-2xl shadow-2xl border-r-4 border-[#00B14F]">
    <div id="toast-title" class="font-extrabold text-xs text-emerald-400"></div>
    <div id="toast-body" class="text-xs mt-0.5"></div>
  </div>

  <div class="w-full max-w-[440px] min-h-screen bg-white flex flex-col relative shadow-2xl overflow-hidden">

    <!-- شاشة دخول العميل -->
    <div id="screen-login" class="flex-1 flex flex-col justify-center p-6 bg-gradient-to-b from-emerald-50 to-white">
      <div class="text-center mb-7">
        <div class="w-20 h-20 nshmi-green rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-lg mb-3">🛵</div>
        <h1 class="text-3xl font-extrabold text-slate-800">Nshmi<span class="nshmi-text">Bike</span> 🇯🇴</h1>

      </div>

      <div class="bg-white p-5 rounded-3xl shadow-md border border-slate-100 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">الاسم الكامل</label>
          <input id="login-name" type="text" placeholder="مثال: محمد العبدالله" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-[#00B14F]">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">رقم الهاتف الأردني</label>
          <input id="login-phone" type="tel" placeholder="079xxxxxxx" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-left focus:outline-none focus:border-[#00B14F]" dir="ltr">
        </div>

        <button onclick="loginRider()" id="btn-login" class="w-full nshmi-green text-white font-extrabold py-3.5 rounded-2xl shadow-lg text-sm">
          دخول وتفعيل الإشعارات 🔔
        </button>
        <p id="login-error" class="text-xs text-red-600 font-bold text-center hidden"></p>
      </div>
    </div>

    <!-- شاشة الراكب الرئيسية -->
    <div id="screen-rider" class="hidden flex-1 flex flex-col h-screen">
      <header class="p-3 bg-white shadow-sm flex justify-between items-center z-20">
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-slate-800 text-sm">Nshmi<span class="nshmi-text">Bike</span></span>
          <span id="rider-greeting" class="text-[11px] bg-emerald-50 text-emerald-700 font-bold px-2 py-0.5 rounded-full"></span>
        </div>
        <div class="flex gap-1.5">
          <button onclick="testAudio()" class="bg-emerald-50 text-emerald-700 text-[11px] font-bold px-2 py-1 rounded-full" title="اختبار الصوت">🔔</button>
          <button onclick="triggerSOS()" class="bg-red-600 text-white text-[11px] font-bold px-2.5 py-1 rounded-full">🆘 SOS</button>
          <button onclick="logout()" class="bg-slate-100 text-slate-600 text-[11px] font-bold px-2.5 py-1 rounded-full">خروج</button>
        </div>
      </header>

      <div class="relative flex-1 bg-slate-200">
        <div id="map"></div>
        <button onclick="useMyGPS()" class="absolute top-3 right-3 z-10 bg-white px-3 py-1.5 rounded-xl shadow text-xs font-bold text-slate-700">
          📍 موقعي الحالي
        </button>
        <div class="absolute bottom-2 left-2 z-10 bg-white/90 px-2.5 py-1 rounded-lg text-[10px] font-bold text-slate-700 shadow">
          اضغط على الخريطة لتحديد وجهتك بدقة
        </div>
      </div>

      <!-- لوحة الحجز -->
      <div id="rider-panel-book" class="bg-white rounded-t-3xl shadow-[0_-6px_24px_rgba(0,0,0,0.1)] p-3.5 z-20">
        <div class="bg-slate-50 rounded-2xl p-2 border border-slate-100 space-y-1.5 mb-2">
          <select id="pickup-select" onchange="updateRoute()" class="w-full bg-transparent text-xs font-bold text-slate-700 focus:outline-none">
            <option value="31.9648,35.9080">🟢 عمّان: العبدلي (البوليفارد)</option>
            <option value="32.0160,35.8695">🟢 عمّان: الجامعة الأردنية</option>
            <option value="31.9531,35.8594">🟢 عمّان: الدوار السابع</option>
            <option value="31.9516,35.9393">🟢 عمّان: وسط البلد</option>
            <option value="31.9566,35.8511">🟢 عمّان: الصويفية / الوكالات</option>
            <option value="31.9896,35.8665">🟢 عمّان: شارع المدينة المنورة</option>
            <option value="32.0352,35.8726">🟢 عمّان: الجبيهة</option>
            <option value="31.9023,35.8475">🟢 عمّان: مرج الحمام</option>
            <option value="32.5568,35.8469">🟢 إربد: وسط المدينة / اليرموك</option>
            <option value="32.0608,36.0942">🟢 الزرقاء: الوسط التجاري</option>
            <option value="32.0392,35.7272">🟢 السلط: وسط المدينة</option>
            <option value="31.7197,35.7939">🟢 مادبا: وسط المدينة</option>
            <option value="29.5321,35.0063">🟢 العقبة: وسط المدينة</option>
            <option value="gps" hidden>🟢 موقعي الحالي (GPS)</option>
          </select>
          <hr class="border-slate-200">
          <select id="dropoff-select" onchange="updateRoute()" class="w-full bg-transparent text-xs font-bold text-slate-700 focus:outline-none">
            <option value="31.9531,35.8594">📍 عمّان: الدوار السابع</option>
            <option value="31.9566,35.8511">📍 عمّان: الصويفية / الوكالات</option>
            <option value="32.0160,35.8695">📍 عمّان: الجامعة الأردنية</option>
            <option value="31.9648,35.9080">📍 عمّان: العبدلي</option>
            <option value="31.9516,35.9393">📍 عمّان: وسط البلد</option>
            <option value="31.9896,35.8665">📍 عمّان: شارع المدينة المنورة</option>
            <option value="32.5568,35.8469">📍 إربد: وسط المدينة / اليرموك</option>
            <option value="32.0608,36.0942">📍 الزرقاء: الوسط التجاري</option>
            <option value="29.5321,35.0063">📍 العقبة: وسط المدينة</option>
            <option value="custom" hidden>📍 الوجهة المحددة على الخريطة</option>
          </select>
        </div>

        <div class="grid grid-cols-3 gap-2 mb-2">
          <button onclick="selectTier('SCOOTER')" id="tier-SCOOTER" class="tier-btn border-2 border-[#00B14F] bg-emerald-50 rounded-xl p-1.5 text-center">
            <div class="text-lg">🛵</div>
            <div class="text-[11px] font-extrabold">نشمي سكوتر</div>
            <div id="price-SCOOTER" class="text-xs font-extrabold nshmi-text">0.60 د.أ</div>
          </button>
          <button onclick="selectTier('BIKE')" id="tier-BIKE" class="tier-btn border border-slate-200 bg-white rounded-xl p-1.5 text-center">
            <div class="text-lg">🏍️</div>
            <div class="text-[11px] font-extrabold">نشمي بايك</div>
            <div id="price-BIKE" class="text-xs font-extrabold text-slate-700">0.75 د.أ</div>
          </button>
          <button onclick="selectTier('EXPRESS')" id="tier-EXPRESS" class="tier-btn border border-slate-200 bg-white rounded-xl p-1.5 text-center">
            <div class="text-lg">📦</div>
            <div class="text-[11px] font-extrabold">طرود سريعة</div>
            <div id="price-EXPRESS" class="text-xs font-extrabold text-slate-700">0.70 د.أ</div>
          </button>
        </div>

        <div id="car-savings-badge" class="bg-emerald-50 text-emerald-800 text-[11px] font-bold text-center py-1 rounded-lg mb-2">
          💰 توفر أكثر من 50% مقارنة بالسيارة!
        </div>

        <div class="flex gap-1.5 mb-2">
          <input id="promo-input" type="text" placeholder="كود الخصم (اختياري)" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs uppercase font-bold">
          <button onclick="applyPromo()" class="bg-slate-800 text-white px-3 rounded-xl text-xs font-bold">تطبيق</button>
        </div>

        <div class="flex items-center justify-between text-xs mb-2.5">
          <label class="flex items-center gap-1.5 font-bold text-slate-700">
            <input id="extra-helmet" type="checkbox" checked class="accent-[#00B14F] w-4 h-4">
            <span>🪖 خوذة معقمة + كاب رأس</span>

          <select id="payment-method" class="bg-slate-100 px-2 py-1 rounded-lg font-bold text-slate-700">
            <option value="كاش">💵 كاش</option>
            <option value="زين كاش">📱 زين كاش</option>
            <option value="CliQ">🏦 CliQ</option>
          </select>
        </div>

        <button onclick="requestRide()" class="w-full nshmi-green text-white font-extrabold py-3 rounded-2xl shadow-lg text-sm">
          اطلب NshmiBike الآن
        </button>
      </div>

      <!-- لوحة الرحلة النشطة -->
      <div id="rider-panel-active" class="hidden bg-white rounded-t-3xl shadow-2xl p-4 z-20 space-y-3">
        <div class="flex justify-between items-center">
          <span id="rider-ride-status" class="bg-amber-100 text-amber-800 text-xs font-extrabold px-3 py-1 rounded-full">
            جاري البحث عن كابتن قريب...
          </span>
          <span id="rider-ride-fare" class="font-extrabold text-slate-800 text-sm"></span>
        </div>

        <div id="captain-info-box" class="hidden bg-slate-50 p-3 rounded-2xl border border-slate-100 flex justify-between items-center">
          <div>
            <div id="cap-info-name" class="font-extrabold text-sm text-slate-800"></div>
            <div id="cap-info-bike" class="text-xs text-slate-500"></div>
            <div class="text-[11px] text-emerald-700 font-bold">✓ الخوذة الإضافية جاهزة</div>
          </div>
          <div class="flex gap-1.5">
            <button onclick="shareRide()" class="bg-white border border-slate-200 px-2.5 py-1.5 rounded-xl text-xs font-bold">🔗 مشاركة</button>
            <a id="cap-call-link" href="#" class="bg-emerald-600 text-white px-2.5 py-1.5 rounded-xl text-xs font-bold">📞 اتصال</a>
          </div>
        </div>

        <div id="rider-chat-box" class="hidden border border-slate-100 rounded-2xl p-2 bg-slate-50">
          <div id="rider-messages" class="max-h-24 overflow-y-auto text-xs space-y-1 mb-2"></div>
          <div class="flex gap-1">
            <input id="rider-chat-input" type="text" placeholder="راسل الكابتن..." class="flex-1 bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs">
            <button onclick="sendChat()" class="nshmi-green text-white px-3 rounded-xl text-xs font-bold">إرسال</button>
          </div>
        </div>

        <button onclick="cancelRideRider()" class="w-full bg-slate-100 text-slate-700 font-bold py-2.5 rounded-xl text-xs">إلغاء الطلب</button>
      </div>

      <!-- لوحة التقييم -->
      <div id="rider-panel-rating" class="hidden bg-white rounded-t-3xl shadow-2xl p-5 z-20 text-center space-y-3">
        <div class="text-3xl">🎉</div>
        <h3 class="font-extrabold text-slate-800 text-base">الحمد لله على السلامة!</h3>
        <p id="rating-summary" class="text-xs text-slate-500 font-semibold"></p>
        <div class="flex justify-center gap-2 text-2xl">
          <button onclick="rateRide(1)">⭐</button>
          <button onclick="rateRide(2)">⭐</button>
          <button onclick="rateRide(3)">⭐</button>
          <button onclick="rateRide(4)">⭐</button>
          <button onclick="rateRide(5)">⭐</button>
        </div>
        <button onclick="rateRide(5)" class="w-full nshmi-green text-white font-extrabold py-3 rounded-2xl text-sm">حجز رحلة جديدة</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, doc, getDoc, setDoc, updateDoc,
      onSnapshot, query, serverTimestamp, orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXa39YZfFdLQ48CYgjHNSHI1mlIRuA1UU",
      authDomain: "nshmibike.firebaseapp.com",
      databaseURL: "https://nshmibike-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nshmibike",
      storageBucket: "nshmibike.firebasestorage.app",
      messagingSenderId: "506031565051",
      appId: "1:506031565051:web:fc915e5a2173e841c7a85e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // نظام الصوت والإشعارات
    let audioCtx = null;
    function unlockAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(kind) {
      try {
        unlockAudio();
        if (!audioCtx) return;
        const notes = kind === 'chat' ? [880, 1175] : [587, 784, 988];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime + i * 0.13);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.13 + 0.28);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + i * 0.13);
          osc.stop(audioCtx.currentTime + i * 0.13 + 0.3);
        });
      } catch (e) {}
    }

    async function requestNotifPermission() {
      try {
        const LN = window.Capacitor?.Plugins?.LocalNotifications;
        if (LN) await LN.requestPermissions();
        else if ('Notification' in window && Notification.permission === 'default') {
          await Notification.requestPermission();
        }
      } catch (e) {}
    }

    async function notifyRider(title, body, kind = 'status') {
      playTone(kind);
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

      const toast = document.getElementById('toast-banner');
      document.getElementById('toast-title').innerText = title;
      document.getElementById('toast-body').innerText = body;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4500);

      try {
        const LN = window.Capacitor?.Plugins?.LocalNotifications;
        if (LN) {
          await LN.schedule({
            notifications: [{ title, body, id: Math.floor(Math.random() * 100000) + 1 }]
          });
        } else if ('Notification' in window && Notification.permission === 'granted') {
          new Notification(title, { body, icon: 'icon.svg' });
        }
      } catch (e) {}
    }

    window.testAudio = () => {
      notifyRider('🔔 إشعار تجريبي', 'الصوت والإشعارات تعمل بنجاح!', 'chat');
    };

    let pricing = { scooterBase: 0.25, scooterPerKm: 0.15, scooterMin: 0.60, bikeBase: 0.30, bikePerKm: 0.18, bikeMin: 0.75 };
    let activeDiscountPct = 0, currentUser = null, selectedTier = 'SCOOTER';
    let map, pickupMarker, dropoffMarker, routeLine, capMarker;
    let customDropoff = null, gpsPickup = null, currentDistKm = 4.2;
    let fares = { SCOOTER: 0.90, BIKE: 1.05, EXPRESS: 0.95 };
    let activeRideId = null, lastCompletedRideId = null, lastRideStatus = null;
    let unsubRide = null, unsubChat = null;

    onSnapshot(doc(db, 'settings', 'pricing'), (snap) => {
      if (snap.exists()) {
        pricing = { ...pricing, ...snap.data() };
        if (map) updateRoute();
      }
    });

    const bikeIcon = L.divIcon({
      html: '<div style="font-size:26px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));">🛵</div>',
      className: '', iconSize: [30, 30], iconAnchor: [15, 15]
    });

    window.loginRider = async () => {
      unlockAudio();
      await requestNotifPermission();

      const name = document.getElementById('login-name').value.trim();
      const phone = document.getElementById('login-phone').value.trim();
      const errEl = document.getElementById('login-error');
      errEl.classList.add('hidden');

      if (!name || phone.length < 9) {
        errEl.innerText = 'يرجى إدخال الاسم ورقم هاتف أردني صحيح';
        errEl.classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('btn-login');
      btn.innerText = 'جاري الدخول...'; btn.disabled = true;

      try {
        try { await signInAnonymously(auth); } catch (e) {}
        const userRef = doc(db, 'users', phone);
        const existing = await getDoc(userRef);
        if (existing.exists() && existing.data().isBlocked) throw new Error('تم إيقاف هذا الحساب من الإدارة.');

        currentUser = { id: phone, name, phone, role: 'RIDER' };
        await setDoc(userRef, { ...currentUser, updatedAt: serverTimestamp() }, { merge: true });

        document.getElementById('screen-login').classList.add('hidden');
        document.getElementById('screen-rider').classList.remove('hidden');
        document.getElementById('rider-greeting').innerText = `أهلاً ${name}`;
        initMap();
      } catch (err) {
        errEl.innerText = err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.innerText = 'دخول وتفعيل الإشعارات 🔔'; btn.disabled = false;
      }
    };

    window.logout = () => location.reload();

    function initMap() {
      if (map) { map.invalidateSize(); return; }
      map = L.map('map', { zoomControl: false }).setView([31.9648, 35.9080], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      map.on('click', (e) => {
        if (!document.getElementById('rider-panel-book').classList.contains('hidden')) {
          customDropoff = [e.latlng.lat, e.latlng.lng];
          document.getElementById('dropoff-select').value = 'custom';
          updateRoute();
        }
      });
      setTimeout(() => { map.invalidateSize(); updateRoute(); }, 300);
    }

    window.useMyGPS = () => {
      if (!navigator.geolocation) return alert('جهازك لا يدعم تحديد الموقع');
      navigator.geolocation.getCurrentPosition((pos) => {
        gpsPickup = [pos.coords.latitude, pos.coords.longitude];
        document.getElementById('pickup-select').value = 'gps';
        updateRoute();
      }, () => alert('يرجى السماح بصلاحية الموقع GPS'));
    };

    function parseCoords(val) {
      if (val === 'gps' && gpsPickup) return gpsPickup;
      if (val === 'custom' && customDropoff) return customDropoff;
      return val.split(',').map(Number);
    }

    function haversine(c1, c2) {
      const R = 6371;
      const dLat = (c2[0] - c1[0]) * Math.PI / 180;
      const dLon = (c2[1] - c1[1]) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(c1[0]*Math.PI/180)*Math.cos(c2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
      return Math.max(1.0, R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)) * 1.28);
    }

    window.applyPromo = async () => {
      const code = document.getElementById('promo-input').value.trim().toUpperCase();
      if (!code) return;
      const snap = await getDoc(doc(db, 'promos', code));
      if (!snap.exists() || !snap.data().active) {
        activeDiscountPct = 0; updateRoute();
        return alert('كود الخصم غير صحيح أو منتهي');
      }
      activeDiscountPct = Number(snap.data().discountPct || 0);
      updateRoute();
      alert(`🎉 تم تفعيل خصم ${activeDiscountPct}% بنجاح!`);
    };

    window.updateRoute = () => {
      if (!map) return;
      const pCoords = parseCoords(document.getElementById('pickup-select').value);
      const dCoords = parseCoords(document.getElementById('dropoff-select').value);

      if (pickupMarker) map.removeLayer(pickupMarker);
      if (dropoffMarker) map.removeLayer(dropoffMarker);
      if (routeLine) map.removeLayer(routeLine);

      pickupMarker = L.circleMarker(pCoords, { radius: 8, color: '#00B14F', fillOpacity: 1 }).addTo(map);
      dropoffMarker = L.circleMarker(dCoords, { radius: 8, color: '#ef4444', fillOpacity: 1 }).addTo(map);
      routeLine = L.polyline([pCoords, dCoords], { color: '#00B14F', weight: 4, dashArray: '8, 8' }).addTo(map);
      map.fitBounds([pCoords, dCoords], { padding: [45, 45] });

      currentDistKm = haversine(pCoords, dCoords);
      const mult = 1 - (activeDiscountPct / 100);
      fares.SCOOTER = Math.max(0.40, +(Math.max(pricing.scooterMin, pricing.scooterBase + currentDistKm * pricing.scooterPerKm) * mult).toFixed(2));
      fares.BIKE = Math.max(0.50, +(Math.max(pricing.bikeMin || 0.75, pricing.bikeBase + currentDistKm * pricing.bikePerKm) * mult).toFixed(2));
      fares.EXPRESS = Math.max(0.45, +(Math.max(0.70, pricing.scooterBase + currentDistKm * (pricing.scooterPerKm + 0.01)) * mult).toFixed(2));

      document.getElementById('price-SCOOTER').innerText = fares.SCOOTER.toFixed(2) + ' د.أ';
      document.getElementById('price-BIKE').innerText = fares.BIKE.toFixed(2) + ' د.أ';
      document.getElementById('price-EXPRESS').innerText = fares.EXPRESS.toFixed(2) + ' د.أ';

      const estCarFare = Math.max(1.50, +(0.47 + currentDistKm * 0.34 + 0.30).toFixed(2));
      const saved = Math.max(0.50, +(estCarFare - fares[selectedTier]).toFixed(2));
      const promoNote = activeDiscountPct > 0 ? ` (خصم ${activeDiscountPct}%)` : '';
      document.getElementById('car-savings-badge').innerText =
        `المسافة ${currentDistKm.toFixed(1)} كم • توفر ~${saved.toFixed(2)} د.أ عن السيارة${promoNote}`;
    };

    window.selectTier = (tier) => {
      selectedTier = tier;
      document.querySelectorAll('.tier-btn').forEach(b => {
        b.classList.remove('border-2', 'border-[#00B14F]', 'bg-emerald-50');
        b.classList.add('border', 'border-slate-200', 'bg-white');
      });
      const el = document.getElementById('tier-' + tier);
      el.classList.remove('border', 'border-slate-200', 'bg-white');
      el.classList.add('border-2', 'border-[#00B14F]', 'bg-emerald-50');
      updateRoute();
    };

    window.requestRide = async () => {
      unlockAudio();
      const pSel = document.getElementById('pickup-select');
      const dSel = document.getElementById('dropoff-select');
      const pCoords = parseCoords(pSel.value);
      const dCoords = parseCoords(dSel.value);

      const rideDoc = await addDoc(collection(db, 'rides'), {
        riderId: currentUser.id, riderName: currentUser.name, riderPhone: currentUser.phone,
        tier: selectedTier, fareJod: fares[selectedTier],
        distanceKm: Number(currentDistKm.toFixed(1)),
        pickupAddress: pSel.options[pSel.selectedIndex].text,
        dropoffAddress: dSel.options[dSel.selectedIndex].text,
        pickupLat: pCoords[0], pickupLng: pCoords[1],
        dropoffLat: dCoords[0], dropoffLng: dCoords[1],
        paymentMethod: document.getElementById('payment-method').value,
        extraHelmet: document.getElementById('extra-helmet').checked,
        status: 'SEARCHING',
        createdAt: serverTimestamp()
      });

      activeRideId = rideDoc.id;
      lastRideStatus = 'SEARCHING';
      document.getElementById('rider-panel-book').classList.add('hidden');
      document.getElementById('rider-panel-active').classList.remove('hidden');
      document.getElementById('rider-ride-fare').innerText = fares[selectedTier].toFixed(2) + ' د.أ';

      unsubRide = onSnapshot(doc(db, 'rides', activeRideId), (snap) => {
        const data = snap.data();
        if (!data) return;
        const badge = document.getElementById('rider-ride-status');

        if (data.captainLat && data.captainLng && map) {
          if (capMarker) capMarker.setLatLng([data.captainLat, data.captainLng]);
          else capMarker = L.marker([data.captainLat, data.captainLng], { icon: bikeIcon }).addTo(map);
        }

        if (data.status !== lastRideStatus) {
          lastRideStatus = data.status;
          if (data.status === 'ACCEPTED') {
            badge.innerText = 'الكابتن في طريقه إليك!';
            badge.className = 'bg-emerald-100 text-emerald-800 text-xs font-extrabold px-3 py-1 rounded-full';
            showCaptainInfo(data);
            notifyRider('🛵 تم قبول رحلتك!', `الكابتن ${data.captainName} (${data.bikeModel}) في طريقه إليك`, 'status');
          } else if (data.status === 'ARRIVED') {
            badge.innerText = 'الكابتن وصل لموقعك 📍';
            notifyRider('📍 الكابتن وصل!', `الكابتن ${data.captainName} ينتظرك بالخارج`, 'status');
          } else if (data.status === 'ON_TRIP') {
            badge.innerText = 'الرحلة جارية نحو وجهتك 💨';
            notifyRider('💨 انطلقت الرحلة', 'نتمنى لك رحلة آمنة مع NshmiBike', 'status');
          } else if (data.status === 'COMPLETED') {
            notifyRider('🎉 وصلت بالسلامة!', `الأجرة: ${Number(data.fareJod).toFixed(2)} د.أ`, 'status');
            lastCompletedRideId = activeRideId;
            if (unsubRide) unsubRide();
            if (unsubChat) unsubChat();
            if (capMarker && map) { map.removeLayer(capMarker); capMarker = null; }
            activeRideId = null;
            document.getElementById('rider-panel-active').classList.add('hidden');
            document.getElementById('rider-panel-rating').classList.remove('hidden');
            document.getElementById('rating-summary').innerText =
              `الأجرة: ${Number(data.fareJod).toFixed(2)} د.أ (${data.paymentMethod}) • قيّم الكابتن ${data.captainName}`;
          } else if (data.status === 'CANCELLED') {
            resetRiderUI();
          }
        }
      });
      listenChat(activeRideId);
    };

    function showCaptainInfo(data) {
      document.getElementById('captain-info-box').classList.remove('hidden');
      document.getElementById('rider-chat-box').classList.remove('hidden');
      document.getElementById('cap-info-name').innerText = `الكابتن ${data.captainName}`;
      document.getElementById('cap-info-bike').innerText = `${data.bikeModel} • لوحة ${data.plate}`;
      document.getElementById('cap-call-link').href = `tel:${data.captainPhone}`;
    }

    window.rateRide = async (stars) => {
      if (lastCompletedRideId) await updateDoc(doc(db, 'rides', lastCompletedRideId), { rating: stars });
      lastCompletedRideId = null;
      resetRiderUI();
    };

    window.shareRide = async () => {
      const shareText = `أنا الآن في رحلة مع NshmiBike 🛵\nرقم الرحلة: ${activeRideId}`;
      if (navigator.share) { try { await navigator.share({ title: 'تتبع رحلتي', text: shareText }); } catch (e) {} }
      else alert(shareText);
    };

    window.cancelRideRider = async () => {
      if (activeRideId) await updateDoc(doc(db, 'rides', activeRideId), { status: 'CANCELLED' });
      resetRiderUI();
    };

    function resetRiderUI() {
      if (unsubRide) unsubRide();
      if (unsubChat) unsubChat();
      if (capMarker && map) { map.removeLayer(capMarker); capMarker = null; }
      activeRideId = null; lastRideStatus = null;
      document.getElementById('captain-info-box').classList.add('hidden');
      document.getElementById('rider-chat-box').classList.add('hidden');
      document.getElementById('rider-panel-active').classList.add('hidden');
      document.getElementById('rider-panel-rating').classList.add('hidden');
      document.getElementById('rider-panel-book').classList.remove('hidden');
    }

    window.triggerSOS = async () => {
      await addDoc(collection(db, 'sos_alerts'), {
        userId: currentUser?.id || 'guest', rideId: activeRideId || null, createdAt: serverTimestamp()
      });
      if (confirm('🚨 تم إرسال تنبيه الطوارئ للإدارة.\nهل تريد الاتصال بـ 911 الآن؟')) window.location.href = 'tel:911';
    };

    function listenChat(rideId) {
      if (unsubChat) unsubChat();
      let firstLoad = true;
      const q = query(collection(db, 'rides', rideId, 'messages'), orderBy('createdAt', 'asc'));
      unsubChat = onSnapshot(q, (snap) => {
        const box = document.getElementById('rider-messages');
        box.innerHTML = '';
        snap.forEach((m) => {
          const d = m.data();
          const div = document.createElement('div');
          div.className = 'bg-white px-2 py-1 rounded-lg border border-slate-100';
          const sender = document.createElement('span');
          sender.className = 'font-bold text-emerald-700';
          sender.textContent = d.senderName + ': ';
          const txt = document.createElement('span');
          txt.textContent = d.text;
          div.appendChild(sender); div.appendChild(txt);
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;

        if (!firstLoad) {
          snap.docChanges().forEach((chg) => {
            if (chg.type === 'added') {
              const msg = chg.doc.data();
              if (msg.role !== 'RIDER') {
                notifyRider(`💬 رسالة من الكابتن ${msg.senderName}`, msg.text, 'chat');
              }
            }
          });
        }
        firstLoad = false;
      });
    }

    window.sendChat = async () => {
      if (!activeRideId) return;
      const input = document.getElementById('rider-chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      await addDoc(collection(db, 'rides', activeRideId, 'messages'), {
        senderName: currentUser.name, role: 'RIDER', text, createdAt: serverTimestamp()
      });
    };
  </script>
</body>
</html>
